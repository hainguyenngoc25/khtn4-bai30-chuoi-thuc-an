<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Bài 30 – Cân bằng chuỗi thức ăn trong tự nhiên | YooBook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
html,body{height:100%;margin:0}
body{font-family:'Roboto',system-ui,-apple-system,Segoe UI,sans-serif;background:#195658;overflow:hidden;overscroll-behavior:none}

/* ===== Module 3 – namespace: kh4b30-m03- (root class) / m3- (lớp con) ===== */
.kh4b30-m03-root{
  --brand:#195658;--brand-dark:#0f3f3d;--brand-light:#2f827d;--brand-soft:#e6f0ee;
  --ink:#10302d;--muted:#5a8582;--line:#dbe8e5;--bg:#eaf3f1;--gold:#b0803c;
  --ok:#2e9d5b;--bad:#d4493f;--r:16px;--r-sm:11px;
  --sh-1:0 1px 2px rgba(13,42,40,.06);
  --sh-2:0 2px 6px rgba(13,42,40,.06),0 18px 34px -22px rgba(13,42,40,.45);
  --sh-3:0 10px 30px -12px rgba(13,42,40,.32);
  position:fixed;inset:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  font-family:'Roboto',system-ui,-apple-system,Segoe UI,sans-serif;font-size:15px;line-height:1.45;color:var(--ink);
  background:#195658;-webkit-tap-highlight-color:transparent;z-index:1;
}
.kh4b30-m03-root.m3-embedded{position:relative;inset:auto;height:100%}
.kh4b30-m03-root *{box-sizing:border-box}
.kh4b30-m03-root button{font-family:inherit}
.kh4b30-m03-root[hidden],.kh4b30-m03-root [hidden]{display:none!important}
.m3-defs{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}
.kh4b30-m03-root button:focus-visible,.m3-card11:focus-visible{outline:3px solid #f2b62e;outline-offset:2px}

/* ---------- header ---------- */
.m3-top{display:flex;align-items:center;gap:10px;padding:7px 14px;background:#fff;border-bottom:1px solid var(--line);flex:0 0 auto;z-index:20}
.m3-logo{height:26px;display:block;flex:0 0 auto}
.m3-titles{flex:1;min-width:0}
.m3-badge{display:inline-block;max-width:100%;font-size:11px;font-weight:600;color:var(--brand);background:var(--brand-soft);border-radius:99px;padding:1px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:top}
.m3-titles h1{margin:1px 0 0;font-size:16.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m3-tbtn{height:38px;min-width:38px;padding:0 10px;border-radius:11px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--brand-dark);font-size:13px;font-weight:600;flex:0 0 auto}
.m3-tbtn:hover{background:var(--brand-soft);border-color:var(--brand-light)}
.m3-tbtn[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.m3-wave{display:none;width:14px;height:12px;align-items:flex-end;gap:2px}
.m3-wave i{display:block;width:2px;background:currentColor;border-radius:2px;animation:m3wave .8s ease-in-out infinite}
.m3-wave i:nth-child(2){animation-delay:.2s}.m3-wave i:nth-child(3){animation-delay:.4s}
.m3-playing .m3-wave{display:flex}
@keyframes m3wave{0%,100%{height:3px}50%{height:12px}}

/* ---------- thanh step ở chân trang ---------- */
.m3-steps{display:flex;gap:8px;padding:8px 12px;overflow-x:auto;overflow-y:hidden;border-top:1px solid var(--line);scrollbar-width:none;flex:0 0 auto;background:#fff}
.m3-steps::-webkit-scrollbar{display:none}
.m3-step{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:6px 14px 6px 7px;border-radius:99px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;min-height:38px}
.m3-step b{width:22px;height:22px;border-radius:99px;background:var(--brand-soft);color:var(--brand-dark);font-size:12px;display:flex;align-items:center;justify-content:center}
.m3-step:hover{border-color:var(--brand-light)}
.m3-step[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.m3-step[aria-pressed="true"] b{background:rgba(255,255,255,.25);color:#fff}
.m3-step.done b{background:var(--ok);color:#fff}
/* ---------- khung chính ---------- */
.m3-main{flex:1;min-height:0;display:flex;padding:10px}
.m3-frame{flex:1;min-width:0;min-height:0;background:#fff;border-radius:var(--r);box-shadow:var(--sh-2);overflow:hidden;display:flex;flex-direction:column}
.m3-stage{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr)}
.m3-view{position:relative;min-width:0;min-height:0;overflow:hidden;background:#cfe6ea;touch-action:none;user-select:none;-webkit-user-select:none}
.m3-view.orbit{cursor:grab}.m3-view.dragging{cursor:grabbing}
.m3-host{position:absolute;inset:0}
.m3-scene{position:absolute;inset:0;width:100%;height:100%;display:none}
.m3-scene.on{display:block;animation:m3fade .45s ease}
.m3-scene .L-bg{transform:translate(calc(var(--px,0) * -12px),calc(var(--py,0) * -3px))}
.m3-scene .L-mid{transform:translate(calc(var(--px,0) * -6px),calc(var(--py,0) * -2px))}
.m3-scene .L-fore,.m3-scene .L-act{transform:translate(calc(var(--px,0) * 6px),calc(var(--py,0) * 3px))}
.m3-scene .L-w1{transform:translate(calc(var(--px,0) * -10px),calc(var(--py,0) * -2px))}
.m3-scene .L-w2{transform:translate(calc(var(--px,0) * -4px),calc(var(--py,0) * -1px))}
.m3-scene .L-w3{transform:translate(calc(var(--px,0) * 8px),calc(var(--py,0) * 2px))}
.m3-gl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:none}
.kh4b30-m03-root .mp0{fill:var(--mc0,#3f8a3e)}.kh4b30-m03-root .mp1{fill:var(--mc1,#5fae4a)}.kh4b30-m03-root .mp2{fill:var(--mc2,#4ea044)}
.m3-frozen *{animation-play-state:paused!important}
@keyframes m3fade{from{opacity:0}to{opacity:1}}
@keyframes m3in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* nhãn trạng thái trên cảnh */
.m3-state{position:absolute;left:12px;top:78px;z-index:6;background:rgba(255,255,255,.95);border:1.5px solid var(--line);border-radius:99px;padding:6px 14px;font-size:13.5px;font-weight:700;color:var(--brand-dark);box-shadow:var(--sh-1);max-width:calc(100% - 24px);animation:m3in .35s ease}
.m3-state.b{background:#fff3e3;border-color:#f0c58a;color:#8a4f12}
.m3-state.c{background:#e9f8ef;border-color:#b9e2c9;color:#1b6b43}
.m3-hud{position:absolute;right:12px;top:12px;z-index:6;width:min(250px,44%);background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:14px;padding:8px 12px;box-shadow:var(--sh-2);animation:m3in .35s ease}
.m3-hud .m3-crow{min-height:28px;font-size:13px}.m3-hud .m3-crow b{min-width:64px}.m3-hud .m3-note{font-size:10.5px;margin-top:2px;text-align:center}
.m3-draghint{position:absolute;right:12px;top:12px;z-index:6;background:rgba(255,255,255,.88);color:var(--brand-dark);font-size:11.5px;font-weight:600;border-radius:99px;padding:4px 10px;pointer-events:none;border:1px solid var(--line)}

/* chuỗi thức ăn (chặng 1) */
.m3-chain{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.93);backdrop-filter:blur(8px);border-radius:18px;padding:8px 10px;box-shadow:var(--sh-2);max-width:calc(100% - 16px)}
.m3-org{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;border:2.5px solid var(--line);background:#fff;border-radius:14px;padding:6px 10px 5px;cursor:pointer;min-width:92px;opacity:0;transform:translateY(12px) scale(.9);transition:opacity .5s,transform .5s,border-color .15s,box-shadow .15s;pointer-events:none}
.m3-org.show{opacity:1;transform:none;pointer-events:auto}
.m3-org.show:not(.seen){animation:m3glow 1.8s ease-in-out infinite}
.m3-org svg{width:46px;height:46px}
.m3-org span{font-size:13px;font-weight:700;color:var(--brand-dark);white-space:nowrap}
.m3-org.sel{border-color:var(--brand);box-shadow:0 0 0 4px rgba(47,130,125,.28);animation:none}
.m3-org .ck{position:absolute;right:-7px;top:-7px;width:20px;height:20px;border-radius:99px;background:var(--ok);display:none;align-items:center;justify-content:center}
.m3-org.seen .ck{display:flex}
.m3-arrow{font-size:26px;font-weight:900;color:var(--gold);opacity:0;transition:opacity .5s;line-height:1}
.m3-arrow.show{opacity:1}
@keyframes m3glow{0%,100%{box-shadow:0 0 0 0 rgba(176,128,60,.0)}50%{box-shadow:0 0 0 6px rgba(176,128,60,.35)}}

/* điểm tương tác (chặng 3) */
.m3-hsl{position:absolute;inset:0;z-index:7;pointer-events:none}
.m3-hs{position:absolute;left:0;top:0;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:99px;border:3px solid #fff;background:var(--gold);color:#fff;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.32);pointer-events:auto;padding:0}
.m3-hs::before{content:"";position:absolute;inset:-9px;border-radius:99px;border:3px solid rgba(255,255,255,.9);animation:m3ring 1.6s ease-out infinite;pointer-events:none}
.m3-hs.cur{background:var(--brand);box-shadow:0 0 0 5px rgba(255,255,255,.6),0 4px 14px rgba(0,0,0,.32)}
.m3-hs.done{background:var(--ok)}.m3-hs.done::before{display:none}
.m3-hs.lock{background:#93a9a6;cursor:default}.m3-hs.lock::before{display:none}
.m3-hs.pend{background:rgba(255,255,255,.92);color:#6d8a87;border:2.5px dashed #6d8a87;font-size:16px}.m3-hs.pend::before{display:none}
.m3-hs .lb{position:absolute;top:100%;margin-top:7px;left:50%;transform:translateX(-50%);white-space:nowrap;background:rgba(15,63,61,.88);color:#fff;font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 9px;pointer-events:none}
@keyframes m3ring{from{transform:scale(.8);opacity:1}to{transform:scale(1.45);opacity:0}}

/* ---------- panel nhiệm vụ ---------- */
.m3-panel{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:20;width:min(820px,calc(100% - 28px));max-height:44%;min-height:0;display:flex;flex-direction:column;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 36px -10px rgba(13,42,40,.5);overflow:hidden}
.m3-coach{display:flex;align-items:center;gap:12px}
.m3-coach p{margin:0;font-size:16px;font-weight:700;line-height:1.4;color:var(--brand-dark)}
.m3-say{flex:0 0 auto;width:42px;height:42px;border-radius:99px;border:none;background:var(--brand);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 rgba(0,0,0,.16)}
.m3-say:hover{background:var(--brand-light)}
.m3-playing .m3-say{background:var(--gold)}
.m3-panel .m3-opts{grid-template-columns:repeat(3,minmax(0,1fr))}
.m3-panel .m3-opt{align-items:center;font-size:14.5px;min-height:46px;padding:6px 10px}
.m3-pbody{flex:1;min-height:0;overflow:auto;padding:10px 16px 8px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;animation:m3in .35s ease}
.m3-pfoot{flex:0 0 auto;padding:4px 16px 10px;display:flex;gap:8px;justify-content:center}
.m3-pfoot .m3-btn{flex:1;max-width:340px}
.m3-kick{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.m3-ptitle{font-size:18px;font-weight:800;color:var(--brand-dark);line-height:1.25;margin:0}
.m3-task{background:#fff;border:1px solid var(--line);border-left:5px solid var(--brand);border-radius:12px;padding:9px 12px;font-size:14px;color:var(--ink)}
.m3-q{background:#fff8ea;border:1px solid #f0d9a8;border-radius:12px;padding:10px 12px;font-size:15px;font-weight:700;color:#4a3a14;line-height:1.4}
.m3-q>span{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#a0742c;margin-bottom:2px}
.m3-note{margin:0;font-size:12px;color:var(--muted);line-height:1.4}
.m3-info{border-radius:12px;padding:9px 12px;background:#eef5f4;border:1px solid var(--line);font-size:14px;color:#24504c;animation:m3in .35s ease}
.m3-info b{color:var(--brand-dark)}
.m3-info.good{background:#eaf6f0;border-color:#bfe0cf;color:#1e4a37}
.m3-info.warn{background:#fff3e3;border-color:#f0c58a;color:#6d4210}
.m3-res{border-radius:12px;padding:10px 12px;background:#eaf6f0;border:1px solid #bfe0cf;color:#1e4a37;animation:m3in .35s ease;font-size:14px}
.m3-res h4{margin:0 0 4px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#1d6b46}
.m3-res ul{margin:0;padding-left:18px}.m3-res li{margin:2px 0}
.m3-res.b{background:#fff3e3;border-color:#f0c58a;color:#5a3a10}.m3-res.b h4{color:#a0581b}
.m3-flow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-weight:700;font-size:13.5px}
.m3-flow i{font-style:normal;color:var(--gold);font-weight:900}
.m3-chainline{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-weight:700;color:var(--brand-dark);font-size:14px}
.m3-chainline span{display:flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:2px 10px 2px 4px}
.m3-chainline svg{width:22px;height:22px}
.m3-chainline i{font-style:normal;color:var(--gold);font-weight:900;font-size:18px}
.m3-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;box-shadow:var(--sh-1)}
.m3-crow{display:flex;align-items:center;gap:8px;font-size:13.5px;min-height:30px}
.m3-crow .ic{width:26px;height:26px;border-radius:8px;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.m3-crow .ic svg{width:20px;height:20px}
.m3-crow b{min-width:92px;color:var(--brand-dark)}
.m3-crow .dots{flex:1;display:flex;flex-wrap:wrap;gap:1px;min-width:0}
.m3-crow .dots svg{width:15px;height:15px}
.m3-crow em{font-style:normal;font-weight:800;min-width:22px;text-align:right;color:var(--brand-dark)}
.m3-crow .st{flex:1;text-align:right;font-weight:700;color:#2e8c58}
.m3-crow .st.warn{color:#c0661f}.m3-crow .st.bad{color:#c8372e}
.m3-cmpt{width:100%;border-collapse:collapse;font-size:13px}
.m3-cmpt th,.m3-cmpt td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
.m3-cmpt th{font-size:11.5px;color:var(--muted);font-weight:700}
.m3-cmpt td:first-child{font-weight:700;color:var(--brand-dark)}
.m3-up{color:#c8372e;font-weight:800}.m3-dn{color:#235f8d;font-weight:800}
.m3-spots{display:flex;flex-direction:column;gap:6px}
.m3-spot{display:flex;align-items:center;gap:9px;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:7px 10px;font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer}
.m3-spot b{flex:0 0 auto;width:24px;height:24px;border-radius:99px;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px}
.m3-spot.done b{background:var(--ok)}.m3-spot.lock{opacity:.55;cursor:default}.m3-spot.lock b{background:#93a9a6}
.m3-spot.pend b{background:#fff;border:2px dashed #6d8a87;color:#6d8a87}
.m3-spot.cur{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,130,125,.2)}
.m3-spot span{flex:1}.m3-spot em{font-style:normal;font-size:11.5px;color:var(--muted);font-weight:600}

/* nút */
.m3-btn{border:none;border-radius:12px;background:var(--brand);color:#fff;font-weight:700;font-size:14.5px;padding:11px 16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 2px 0 rgba(0,0,0,.16);transition:background .15s,transform .1s;min-height:44px;text-align:center;line-height:1.25}
.m3-btn:hover{background:var(--brand-light)}
.m3-btn:active{transform:translateY(1px)}
.m3-btn.alt{background:#fff;color:var(--brand-dark);border:1.5px solid var(--brand-light);box-shadow:none}
.m3-btn.alt:hover{background:var(--brand-soft)}
.m3-btn.gold{background:var(--gold)}.m3-btn.gold:hover{background:#c0914c}
.m3-btn.warm{background:#c0661f}.m3-btn.warm:hover{background:#d27a33}
.m3-btn[disabled]{opacity:.45;pointer-events:none}

/* phương án trắc nghiệm */
.m3-opts{display:grid;grid-template-columns:1fr;gap:8px}
.m3-opt{display:flex;align-items:center;gap:10px;text-align:left;border-radius:12px;border:2px solid var(--line);background:#fff;padding:9px 12px;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer;line-height:1.35;transition:border-color .15s,background .15s;min-height:48px;width:100%}
.m3-opt:hover{border-color:var(--brand-light);background:#f4faf8}
.m3-opt b{flex:0 0 auto;width:28px;height:28px;border-radius:99px;background:var(--brand-soft);color:var(--brand-dark);display:flex;align-items:center;justify-content:center}
.m3-opt.picked{border-color:var(--brand);background:#eef7f5}.m3-opt.picked b{background:var(--brand);color:#fff}
.m3-opt.wrong{border-color:#e39a8f;background:#fdf2f0}.m3-opt.wrong b{background:var(--bad);color:#fff}
.m3-opt.right{border-color:var(--ok);background:#e9f8ef;box-shadow:0 0 0 3px rgba(46,157,91,.2)}.m3-opt.right b{background:var(--ok);color:#fff}
.m3-opt[disabled]{cursor:default;opacity:.6}
.m3-opt.right[disabled],.m3-opt.picked[disabled],.m3-opt.wrong[disabled]{opacity:1}
.m3-opt.shake{animation:m3shake .35s}
@keyframes m3shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.m3-fb{font-size:14px;border-radius:11px;padding:9px 12px;line-height:1.45;animation:m3in .3s ease}
.m3-fb b{display:block;margin-bottom:1px}
.m3-fb.ok{background:#e9f8ef;color:#1b5a3a;border:1px solid #b9e2c9}
.m3-fb.no{background:#fdf2f0;color:#7d2a22;border:1px solid #f1c4bd}
.m3-fb.neutral{background:#eef5f4;color:#24504c;border:1px solid var(--line)}

.m3-toast{position:absolute;left:50%;bottom:16px;transform:translate(-50%,20px);z-index:50;background:rgba(15,63,61,.94);color:#fff;font-size:13px;font-weight:500;padding:8px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:all .3s;max-width:86%;text-align:center}
.m3-toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- màn hình đầu ---------- */
.m3-intro{position:absolute;inset:0;z-index:100;display:none;overflow:hidden;background:#195658}
.m3-intro.on{display:block}
.m3-intro svg.bgs{position:absolute;inset:0;width:100%;height:100%}
.m3-intro::before{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(ellipse at 50% 50%,rgba(25,86,88,.84) 0%,rgba(25,86,88,.62) 50%,rgba(25,86,88,.28) 100%)}
.m3-introbox{position:absolute;z-index:2;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;text-align:center;color:#fff;padding:0 20px}
.m3-introbox .k{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#d6e78c;text-shadow:0 1px 4px rgba(0,0,0,.45)}
.m3-introbox h1{font-size:clamp(26px,4.4vw,50px);margin:8px 0 10px;line-height:1.12;font-weight:800;text-shadow:0 4px 18px rgba(0,0,0,.5)}

<script>
(function(){
'use strict';
/* =====================================================================
   MODULE 3 – CÂN BẰNG CHUỖI THỨC ĂN TRONG TỰ NHIÊN (Bài 30, Khoa học 4)
   Namespace: kh4b30-m03-   |   window.LessonModules.canBangChuoiThucAn
   5 chặng: 1 Khám phá · 2 Thí nghiệm · 3 Con người tác động · 4 Luyện tập · 5 Ghi nhớ
   Cảnh vẽ bằng SVG nội tuyến; rắn và chuột dùng mô hình 3D GLB (Three.js) phủ lên cảnh,
   tự động quay về hình SVG dự phòng nếu không tải được.
   ===================================================================== */
const P='kh4b30-m03-';
const u=n=>`url(#${P}${n})`;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const $=(r,s)=>r.querySelector(s);
const $$=(r,s)=>[...r.querySelectorAll(s)];
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hexRgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function mix(c1,c2,t){const a=hexRgb(c1),b=hexRgb(c2);return `rgb(${Math.round(lerp(a[0],b[0],t))},${Math.round(lerp(a[1],b[1],t))},${Math.round(lerp(a[2],b[2],t))})`}
const f1=n=>n.toFixed(1);
function blob(cx,cy,rx,ry,n,seed,jit){
  const r=rng(seed),p=[];
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2,k=1+(r()-.5)*jit;p.push([cx+Math.cos(a)*rx*k,cy+Math.sin(a)*ry*k])}
  let d=`M${f1(p[0][0])} ${f1(p[0][1])}`;
  for(let i=0;i<n;i++){
    const p0=p[(i-1+n)%n],p1=p[i],p2=p[(i+1)%n],p3=p[(i+2)%n];
    d+=`C${f1(p1[0]+(p2[0]-p0[0])/6)} ${f1(p1[1]+(p2[1]-p0[1])/6)} ${f1(p2[0]-(p3[0]-p1[0])/6)} ${f1(p2[1]-(p3[1]-p1[1])/6)} ${f1(p2[0])} ${f1(p2[1])}`;
  }
  return d+'Z';
}

/* ---------------- AUDIO_REGISTRY: nơi DUY NHẤT lưu tên file + URL ---------------- */
const AUDIO_REGISTRY={

};

/* ---------------- Trạng thái chung ---------------- */
const S={
  root:null,built:false,active:false,step:0,
  narrationEnabled:true,isPlaying:false,paused:false,
  px:0,py:0,tpx:0,tpy:0,auto:false,autoT:0,raf:0,last:0,
  lastKey:null,introOn:false,cam:{yaw:0,pitch:.36,dist:640,tyaw:0,tpitch:.36,tdist:640}
};
const T={ids:new Set(),
  set(fn,ms){const id=setTimeout(()=>{T.ids.delete(id);fn()},ms);T.ids.add(id);return id},
  clearAll(){T.ids.forEach(clearTimeout);T.ids.clear()}};

/* ---------------- Âm thanh: quản lý duy nhất ---------------- */
const Aud={el:null,token:0,
  stop(){
    this.token++;
    try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}
    if(this.el){const a=this.el;this.el=null;a.onended=a.onerror=a.onplaying=null;try{a.pause()}catch(e){}}
    setPlaying(false);
  },
  /* trả về true nếu có file thật được phát */
  play(key,opt){
    opt=opt||{};
    this.stop();
    const tok=this.token;
    S.lastKey=key;
    if(!opt.force&&!S.narrationEnabled)return false;
    const url=(AUDIO_REGISTRY[key]||{}).url;
    if(!url){ // chưa có audio: bỏ qua nhưng luồng bài học vẫn tiếp tục
      if(opt.onEnd)T.set(()=>{if(tok===this.token)opt.onEnd()},0);
      return false;
    }
    const a=new Audio();a.preload='auto';a.src=url;this.el=a;
    a.onplaying=()=>{if(tok===this.token)setPlaying(true)};
    const fin=()=>{if(tok!==this.token)return;this.el=null;setPlaying(false);if(opt.onEnd)opt.onEnd()};
    a.onended=fin;a.onerror=fin;
    const pr=a.play();
    if(pr&&pr.catch)pr.catch(err=>{
      if(tok!==this.token)return;
      setPlaying(false);
      if(err&&err.name==='NotAllowedError')toast('Nhấn nút Thuyết minh để nghe giọng đọc.');
    });
    return true;
  }
};
function setPlaying(v){
  S.isPlaying=!!v;
  if(S.root)S.root.classList.toggle('m3-playing',!!v&&S.narrationEnabled);
}

/* ---------------- Âm báo đúng/sai (WebAudio, không phải giọng đọc) ---------------- */
let actx=null;
function beep(ok){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const seq=ok?[[660,0],[880,.12]]:[[220,0],[170,.14]];
    seq.forEach(([f,d])=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type=ok?'sine':'triangle';o.frequency.value=f;
      g.gain.setValueAtTime(0,actx.currentTime+d);
      g.gain.linearRampToValueAtTime(.12,actx.currentTime+d+.02);
      g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d+.22);
      o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+d);o.stop(actx.currentTime+d+.25);
    });
  }catch(e){}
}

  ${lg('mouse',[[0,'#aa917d'],[1,'#6f5a4a']])}
  ${lg('wood',[[0,'#d3a96d'],[1,'#a67d49']])}
  ${lg('trunk',[[0,'#6e4b33'],[.5,'#946947'],[1,'#5a3b29']],1,0)}
  ${lg('water',[[0,'#98e4e8'],[.4,'#49b6c2'],[1,'#1b6c84']])}
  ${lg('mud',[[0,'#8d7552'],[1,'#5d4a33']])}
  ${lg('bank',[[0,'#8bb45e'],[.12,'#7aa150'],[.13,'#82593a'],[1,'#4d2f1d']])}
  ${lg('ray',[[0,'#fffbe0',.75],[1,'#fffbe0',0]])}

function compLeaf(L,seed){
  const r=rng(seed);

  const n=4;
  for(let k=0;k<n;k++){

    }

      if(need>0&&s.state!=='hunt'&&s.state!=='rest'&&!s.hunting){
        const free=mAct().filter(m=>!m.hunted);
        if(free.length){
          const c=free.reduce((a,m)=>Math.hypot(m.x-s.x,m.z-s.z)<Math.hypot(a.x-s.x,a.z-s.z)?m:a,free[0]);
          c.hunted=true;s.tgt=c;s.state='hunt';s.t=14;need--;s.path=[];s.planT=0;
        }
      }
      s.cd-=dt;s.ph+=(s.sp>1?2.4+s.sp*.06:.7)*dt;
      let speed=0,tgtLift=0,goal=null;
      switch(s.state){
        case'rest':s.t-=dt;if(s.t<=0&&!s.hunting)snakeWander(s);break;
        case'wander':{
          goal=s.path[0];speed=38;
          if(!goal){if(Math.random()<.4){s.state='rest';s.t=1+Math.random()*2}else snakeWander(s);break}
          if(s.cd<=0){
            const mice=mAct().filter(m=>!m.hunted);
            if(mice.length){
              const c=mice.reduce((a,m)=>Math.hypot(m.x-s.x,m.z-s.z)<Math.hypot(a.x-s.x,a.z-s.z)?m:a,mice[0]);
              if(Math.hypot(c.x-s.x,c.z-s.z)<280&&Math.random()<.5){s.state='watch';s.t=1.3+Math.random()*.7;s.tgt=c;s.path=[]}
            }
            s.cd=3+Math.random()*3;
          }
          break;}
        case'watch':
          tgtLift=1;s.t-=dt;
          if(s.tgt)steer(s,Math.atan2(s.tgt.z-s.z,s.tgt.x-s.x),dt,.9);
          if(s.t<=0){s.state='rest';s.t=.3;s.tgt=null;s.cd=4+Math.random()*3}
          break;
        case'hunt':{
          const m=s.tgt;
          if(!m||m.dying||m.exit){s.state='rest';s.t=.8;s.tgt=null;break}
          s.t-=dt;s.planT-=dt;speed=125;tgtLift=.3;
          if(s.planT<=0||!s.path.length){
            s.planT=1.2;s.row=clamp(m.z,ZH0,ZH1);
            const lj=laneOf(m);
            s.path=lj!=null?routeLane(s,lj,m.z+22):routeTo(s,m.x,m.z+14);
          }
          goal=s.path[0];
          if(Math.hypot(m.x-s.x,m.z-s.z)<28){removeMouse(m);s.tgt=null;s.state='rest';s.t=1.8;s.cd=3;s.path=[];goal=null;speed=0}
          else if(s.t<=0){m.hunted=false;s.tgt=null;s.state='rest';s.t=1;s.path=[];goal=null;speed=0}
          break;}
      }
      /* rắn chỉ bò thẳng dọc luống (trục Z) hoặc ngang vuông góc (trục X) */
      let axis=null;
      if(goal){
        const dx=goal[0]-s.x,dz=goal[1]-s.z;
        if(Math.abs(dx)<3&&Math.abs(dz)<3){s.path.shift();goal=null}
        else{axis=Math.abs(dx)>=Math.abs(dz)?[Math.sign(dx),0]:[0,Math.sign(dz)];s.ax=axis;s.th=Math.atan2(axis[1],axis[0])}
      }
      s.lift=lerp(s.lift,tgtLift,Math.min(1,dt*4));
      let sp=axis?speed:0;
      if(sp>0){
        const nx=s.x+axis[0]*sp*dt,nz=s.z+axis[1]*sp*dt;
        if(blocked(s,nx,nz)||(!inReg(nx,nz)&&inReg(s.x,s.z))){
          sp=0;s.blockT+=dt;
          if(s.blockT>1.5){s.blockT=0;if(s.state==='wander')snakeWander(s);else if(s.state==='hunt')s.planT=0}
        }else s.blockT=0;
      }
      s.sp=lerp(s.sp,sp,Math.min(1,dt*3));
      if(s.sp>.5&&s.ax){
        const mv=s.sp*dt;
        s.x+=s.ax[0]*mv;s.z+=s.ax[1]*mv;
        if(goal){   /* chỉnh nốt độ lệch nhỏ so với trục để đường bò luôn thẳng */
          if(s.ax[0]!==0){const r=goal[1]-s.z;s.z+=Math.sign(r)*Math.min(Math.abs(r),30*dt)}
          else{const r=goal[0]-s.x;s.x+=Math.sign(r)*Math.min(Math.abs(r),30*dt)}
        }
        const l=s.trail[0];
        if(Math.hypot(s.x-l[0],s.z-l[1])>=3.2){s.trail.unshift([s.x,s.z]);if(s.trail.length>90)s.trail.pop()}
        else s.trail[0]=[s.x,s.z];
      }    });
    updateHunter(dt);
  }

  /* =================== VẼ (chiếu phối cảnh) =================== */
  function poly(el,pts,y){
    let d='';
    for(let i=0;i<pts.length;i++){const p=proj(pts[i][0],y||0,pts[i][1]);d+=(i?'L':'M')+f1(p[0])+' '+f1(p[1])}
    el.setAttribute('d',d+'Z');
  }
  function drawSnake(sn){
    const N=22,SP=3.2,L=GLS.snake?SNAKE_LEN+14:150,step=(L/SP)/(N-1),tr=sn.trail;
    const wr=[];
    for(let i=0;i<N;i++){
      const idx=i*step,k=Math.min(Math.floor(idx),tr.length-2),f=idx-k,a=tr[k],b=tr[k+1];
      wr.push([a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f]);
    }
    const wp=wr.map((p,i)=>{let sx=0,sz=0;for(let k=-2;k<=2;k++){const q=wr[Math.max(0,Math.min(N-1,i+k))];sx+=q[0];sz+=q[1]}return[sx/5,sz/5]});   /* bo tròn nhẹ góc vuông */
    const A=2.5*(.25+.75*Math.min(1,sn.sp/30)),pts=[],ws=[],sc=[],wpts=[];
    for(let i=0;i<N;i++){
      const p0=wp[Math.max(0,i-1)],p1=wp[Math.min(N-1,i+1)];
      let tx=p0[0]-p1[0],tz=p0[1]-p1[1];const l=Math.hypot(tx,tz)||1;tx/=l;tz/=l;
      const env=Math.sin(Math.min(1,(i+.5)/6)*Math.PI/2)*(1-.2*i/N),off=A*Math.sin(sn.ph-i*.62)*env;
      const q=i/(N-1),w=6.4*(1-Math.pow(q,1.7)*.88)+.7;
      const lf=sn.lift*16*Math.pow(Math.max(0,1-i/9),2);
      const p=proj(wp[i][0]-tz*off,w*.7+lf,wp[i][1]+tx*off);
      pts.push([p[0],p[1]]);sc.push(p[2]);ws.push(w*p[2]);wpts.push([wp[i][0]-tz*off,w*.7+lf,wp[i][1]+tx*off]);
      if(i===0){sn.depth=p[3];sn.s0=p[2]}
    }
    sn.wpts=wpts;
    const nrm=[];
    for(let i=0;i<N;i++){
      const p0=pts[Math.max(0,i-1)],p1=pts[Math.min(N-1,i+1)];
      let tx=p0[0]-p1[0],ty=p0[1]-p1[1];const l=Math.hypot(tx,ty)||1;tx/=l;ty/=l;
      nrm.push([-ty,tx,tx,ty]);
    }
    let hl='',bk='';const left=[],right=[],bA=[],bB=[];
    for(let i=0;i<N;i++){
      const n=nrm[i],ds=n[1]>=0?1:-1,w=ws[i],p=pts[i];
      left.push(`${f1(p[0]+n[0]*w)} ${f1(p[1]+n[1]*w)}`);right.push(`${f1(p[0]-n[0]*w)} ${f1(p[1]-n[1]*w)}`);
      bA.push(`${f1(p[0]+n[0]*ds*w*.15)} ${f1(p[1]+n[1]*ds*w*.15)}`);bB.push(`${f1(p[0]+n[0]*ds*w*.92)} ${f1(p[1]+n[1]*ds*w*.92)}`);
      hl+=(i?'L':'M')+`${f1(p[0]-n[0]*ds*w*.5)} ${f1(p[1]-n[1]*ds*w*.5)}`;
      if(i>=2&&i<N-3&&i%3===2){
        const seg=step*SP*1.1*sc[i],tx=n[2]*seg,ty=n[3]*seg,bw=w*.78;
        bk+=`M${f1(p[0]+tx)} ${f1(p[1]+ty)}L${f1(p[0]-n[0]*ds*bw*.9)} ${f1(p[1]-n[1]*ds*bw*.9)}L${f1(p[0]-tx)} ${f1(p[1]-ty)}L${f1(p[0]+n[0]*ds*bw*.2)} ${f1(p[1]+n[1]*ds*bw*.2)}Z`;
      }
    }
    const bdd='M'+left.join('L')+'L'+right.reverse().join('L')+'Z';
    sn.bd.setAttribute('d',bdd);if(!sn.gl)sn.sh.setAttribute('d',bdd);
    sn.bl.setAttribute('d','M'+bA.join('L')+'L'+bB.reverse().join('L')+'Z');
    sn.hl.setAttribute('d',hl);sn.bk.setAttribute('d',bk);
    const h=pts[0],h2=pts[2],th=Math.atan2(h[1]-h2[1],h[0]-h2[0]),sg=Math.cos(th)>=0?1:-1;
    sn.hd.setAttribute('transform',`translate(${f1(h[0])} ${f1(h[1])}) rotate(${f1(th*180/Math.PI)}) scale(${f1(sc[0])} ${f1(sc[0]*sg)})`);
    /* bóng đổ lên đất */
    if(sn.gl){
      let d='';wp.forEach((q,i)=>{const p=proj(q[0],0,q[1]);d+=(i?'L':'M')+f1(p[0])+' '+f1(p[1])});
      sn.sh.setAttribute('d',d);sn.sh.setAttribute('fill','none');sn.sh.setAttribute('stroke','#102010');sn.sh.setAttribute('stroke-width',f1(8*sc[0]));sn.sh.setAttribute('opacity','.2');sn.sh.setAttribute('stroke-linecap','round');sn.sh.removeAttribute('transform');
    }else{const sp=proj(sn.x,0,sn.z);sn.sh.setAttribute('transform',`translate(${f1(2*sp[2])} ${f1(5*sp[2])})`)}
  }
  function render(){
    setupCam();
    self.camC=C.slice();
    const yh=300-FOCAL*Math.tan(cam.pitch);
    lawn.setAttribute('y',f1(yh));
    const off=((cam.yaw*FOCAL)%W+W)%W;
    pan.setAttribute('transform',`translate(${f1(off)} ${f1(yh)})`);
    /* mặt trên + luống */
    quads.forEach(q=>poly(q.p,q.pts,0));
    /* các mặt cắt của khối đất */
    faces.forEach(f=>{
      const vis=(C[0]-f.c[0])*f.n[0]+(C[1]-f.c[1])*f.n[1]+(C[2]-f.c[2])*f.n[2]>0;
      f.g.style.display=vis?'':'none';
      if(!vis)return;
      const p0=proj(f.o[0],0,f.o[2]),x0=p0[0],y0=p0[1];
      const p1=proj(f.o[0]+f.ux[0]*f.W,0,f.o[2]+f.ux[2]*f.W),x1=p1[0],y1=p1[1];
      const p2=proj(f.o[0],-FH,f.o[2]);
      f.g.setAttribute('transform',`matrix(${f1((x1-x0)/f.W)} ${f1((y1-y0)/f.W)} ${f1((p2[0]-x0)/FH)} ${f1((p2[1]-y0)/FH)} ${f1(x0)} ${f1(y0)})`);
    });
    /* vật thể */
    items.forEach(it=>{
      if(it.fence){
        let rl='',ps='',s0=0,n=0;
        it.pts.forEach((p,i)=>{
          const b=proj(p[0],0,p[1]),t=proj(p[0],36,p[1]),r1=proj(p[0],16,p[1]),r2=proj(p[0],28,p[1]);
          ps+=`M${f1(b[0])} ${f1(b[1])}L${f1(t[0])} ${f1(t[1])}`;s0+=b[2];n++;
          rl+=(i?'L':'M')+f1(r1[0])+' '+f1(r1[1]);
          it['r2'+i]=r2;
        });
        let rl2='';it.pts.forEach((p,i)=>{const r2=proj(p[0],28,p[1]);rl2+=(i?'L':'M')+f1(r2[0])+' '+f1(r2[1])});
        const s=s0/n;it.rail.setAttribute('d',rl+rl2);it.rail.setAttribute('stroke-width',f1(3.5*s));
        it.post.setAttribute('d',ps);it.post.setAttribute('stroke-width',f1(6*s));
        it.depth=proj(it.mid[0],0,it.mid[1])[3];
        return;
      }
      if(it.isSnake){drawSnake(it);return}
      if(it.isHunter){
        if(hu.state==='off')return;
        const p=proj(it.x,0,it.z),s=p[2];
        it.depth=p[3];
        const q=proj(it.x+it.vx*6,0,it.z+it.vz*6),ux=q[0]-p[0];
        if(it.moving&&Math.abs(ux)>.05)it.dir=ux>0?1:-1;else if(it.face){const pf2=proj(it.x+it.face*30,0,it.z);it.dir=pf2[0]>p[0]?1:-1}
        const sw=it.moving?Math.sin(it.ph)*30:0;
        hu.legA.setAttribute('transform',`rotate(${f1(sw)})`);hu.legB.setAttribute('transform',`rotate(${f1(-sw)})`);
        hu.armB.setAttribute('transform',`rotate(${f1(it.moving?-sw*.8:4)})`);
        hu.armA.setAttribute('transform',`rotate(${f1(it.moving?sw*.8:4-it.reach*84)})`);
        hu.body.setAttribute('transform',`translate(0 ${f1(it.moving?-Math.abs(Math.sin(it.ph))*1.6:it.lean*4)}) rotate(${f1(it.lean*20)})`);
        hu.g.setAttribute('transform',`translate(${f1(p[0])} ${f1(p[1])}) scale(${f1(it.dir*s*.95)} ${f1(s*.95)})`);
        return;
      }
      if(it.mo){
        const p=proj(it.x,0,it.z),s=p[2];it.depth=p[3];
        let ux=0,uy=0;
        if(it.vx||it.vz){const q=proj(it.x+it.vx*8,0,it.z+it.vz*8);ux=q[0]-p[0];uy=q[1]-p[1];const l=Math.hypot(ux,uy)||1;if(Math.abs(ux)>.05)it.dir=ux>0?1:-1;it.fx=lerp(it.fx,.5+.5*Math.abs(ux/l),.3)}
        else if(it.state==='gnaw'||it.state==='sniff'){if(it.faceX){const q=proj(it.x+it.faceX,0,it.z);it.dir=q[0]>p[0]?1:-1}it.fx=lerp(it.fx,1,.2)}
        else it.fx=lerp(it.fx,1,.2);
        if(it.shd){it.shd.setAttribute('cx',f1(p[0]));it.shd.setAttribute('cy',f1(p[1]));it.shd.setAttribute('rx',f1(24*s));it.shd.setAttribute('ry',f1(8*s))}
        const k=.78*s;
        it.g.setAttribute('transform',`translate(${f1(p[0])} ${f1(p[1])}) scale(${f1(it.dir*k*it.fx)} ${f1(k)})`);
        return;
      }
      const p=proj(it.x,it.y,it.z);
      it.depth=p[3];
      if(it.mini)it.vis+=clamp(it.tv-it.vis,-.8*(self.dtLast||.016),.5*(self.dtLast||.016));
      const hide=p[3]<90||(it.mini&&it.vis<.03);
      if(hide!==it.hidden){it.hidden=hide;it.g.style.display=hide?'none':''}
      if(!hide)it.g.setAttribute('transform',`translate(${f1(p[0])} ${f1(p[1])}) scale(${f1(p[2]*it.k)} ${f1(p[2]*it.k*(it.mini?1-.32*(self.wilt||0):1))})`);
    });
    const order=items.slice().sort((a,b)=>b.depth-a.depth);
    for(let i=0;i<order.length;i++){const g=order[i].g;if(wld.children[i]!==g)wld.insertBefore(g,wld.children[i]||null)}
    GLS.frame(self,self.dtLast);
  }
  render();
  self.clear=function(){self.snakes.forEach(s=>s.g.remove());self.mice.forEach(m=>m.g.remove());self.snakes=[];self.mice=[]};
  return self;
}

  svg.innerHTML=w1+w2+w3;
  const trEls={};$$(svg,'.ftree').forEach(g=>{if(g.classList.contains('sap'))return;trEls[g.dataset.i]={g,trk:$(g,'.trk'),cnp:$(g,'.cnp'),stp:$(g,'.stp'),v:1}});

  };
  self.update(.0001);

}

/* ---------------- tiện ích ---------------- */
function toast(msg){
  const t=S.root&&R('toast');if(!t)return;
  t.textContent=msg;t.classList.add('on');
  clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2400);
}
function refreshNarr(){
  const b=R('narr');if(!b)return;
  b.setAttribute('aria-pressed',S.narrationEnabled?'true':'false');
  if(!S.narrationEnabled)S.root.classList.remove('m3-playing');
}
/* ---- GIỌNG THUYẾT MINH ----
   Đọc đúng câu hướng dẫn đang hiện trên màn hình bằng giọng đọc tiếng Việt của trình duyệt (Web Speech).
   Muốn dùng giọng thu sẵn: thêm file .mp3 vào AUDIO_REGISTRY rồi gọi Aud.play(key) thay cho speak(). */
const SPK_ICON='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9zM16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
let viVoice=null;
function pickVoice(){
  try{const vs=speechSynthesis.getVoices();viVoice=vs.find(v=>/^vi/i.test(v.lang))||null}catch(e){}
}
if(window.speechSynthesis){pickVoice();try{speechSynthesis.addEventListener('voiceschanged',pickVoice)}catch(e){}}
function speak(text,force){
  S.lastSay=text;
  if(!text||(!S.narrationEnabled&&!force))return;
  Aud.stop();
  if(!window.speechSynthesis||!window.SpeechSynthesisUtterance)return;
  const tok=Aud.token,u=new SpeechSynthesisUtterance(text.replace(/[→↑↓]/g,' ').replace(/\s+/g,' '));
  u.lang='vi-VN';u.rate=.95;if(viVoice)u.voice=viVoice;
  u.onstart=()=>{if(tok===Aud.token)setPlaying(true)};
  u.onend=u.onerror=()=>{if(tok===Aud.token)setPlaying(false)};
  try{speechSynthesis.speak(u)}catch(e){}
}
const coach=t=>`<div class="m3-coach"><button class="m3-say" type="button" data-act="say" aria-label="Nghe lại">${SPK_ICON}</button><p>${t}</p></div>`;
function potatoTxt(p){return p>=.8?['Xanh tốt','']:p>=.6?['Bị hại','warn']:['Bị hại nhiều','bad']}
function optBtn(o,i,act,cls,dis){return `<button class="m3-opt ${cls||''}" type="button" data-act="${act}" data-i="${i}" ${dis?'disabled':''}><b>${'ABCD'[i]}</b><span>${esc(o.t)}</span></button>`}

/* =====================================================================
   SỰ KIỆN
   ===================================================================== */
function bindEvents(){
  const root=S.root,view=R('view');
  root.addEventListener('click',e=>{
    const b=e.target.closest('button');
    if(!b||b.disabled)return;
    if(b.dataset.step!=null){if(+b.dataset.step!==G.stage)gotoStage(+b.dataset.step);return}
    const a=b.dataset.act,i=b.dataset.i!=null?+b.dataset.i:null;
    switch(a){
      case'start':introStart();break;
      case'fs':toggleFs();break;
      case'say':speak(S.lastSay,true);break;
      case'hint':S.hint=!S.hint;refreshHint();break;
      case'narr':toggleNarration();break;
      case'next':gotoStage(G.stage+1);break;
      case'org':pickOrg(i);break;
      case'pred':pickPred(i);break;
      case'reduce':startReduce();break;
      case'restore':startRestore();break;
      case'redo2':enter2();renderPanel();break;
      case'hs':openSpot(i);break;
      case'ans3':answerSpot(i);break;
      case'finish':finish();break;
    }
  });
  /* step 1–2: kéo để xoay cánh đồng 3D, lăn chuột để phóng to/thu nhỏ */
  let d=null;
  view.addEventListener('pointerdown',e=>{
    if(G.stage>1||e.target.closest('button,.m3-chain'))return;
    d={x:e.clientX,y:e.clientY,cy:S.cam.tyaw,cp:S.cam.tpitch};view.classList.add('dragging');
    try{view.setPointerCapture(e.pointerId)}catch(_){}
  });
  view.addEventListener('pointermove',e=>{
    if(!d)return;
    S.cam.tyaw=d.cy-(e.clientX-d.x)*.006;S.cam.tpitch=clamp(d.cp+(e.clientY-d.y)*.004,.12,1.0);
  });
  const end=()=>{d=null;view.classList.remove('dragging')};
  view.addEventListener('pointerup',end);view.addEventListener('pointercancel',end);
  view.addEventListener('wheel',e=>{if(G.stage>1)return;e.preventDefault();S.cam.tdist=clamp(S.cam.tdist*(1+e.deltaY*.0012),400,1200)},{passive:false});
}
/* ---- BÀN TAY CHỈ DẪN: trỏ vào việc cần bấm tiếp theo ---- */
S.hint=true;
function refreshHint(){
  const b=R('hintbtn');if(!b)return;
  b.setAttribute('aria-pressed',S.hint?'true':'false');b.classList.toggle('m3-hint-on',!!S.hint);
  if(!S.hint)R('hand').hidden=true;
}
function guideTarget(){
  const q=s=>S.root.querySelector(s),next=()=>q('[data-r="pfoot"] [data-act="next"]:not(:disabled)');
  if(G.stage===0){
    for(let i=0;i<S1.shown;i++)if(!S1.seen[i])return q(`.m3-org[data-i="${i}"]`);
    return S1.ready?next():null;
  }
  if(G.stage===1){
    const ph=S2.phase;
    if(ph==='A')return S2.pred==null?q('.m3-panel .m3-opts'):q('[data-act="reduce"]:not(:disabled)');
    if(ph==='B')return q('[data-act="restore"]');
    if(ph==='C')return next();
    return null;
  }
  if(allDone())return null;
  const s=S3.cur!=null?POND_SPOTS[S3.cur]:null;
  if(s&&!s.pending&&!S3.done[S3.cur])return q('.m3-panel .m3-opts');
  const nx=realSpots().find(x=>!S3.done[POND_SPOTS.indexOf(x)]);
  return nx?q(`.m3-hs[data-i="${POND_SPOTS.indexOf(nx)}"]`):null;
}
function updateHand(){
  const h=R('hand');if(!h)return;
  const el=S.hint&&S.active&&!S.introOn?guideTarget():null;
  const st=R('stage').getBoundingClientRect(),r=el?el.getBoundingClientRect():null;
  if(!r||!r.width||!st.width){if(!h.hidden)h.hidden=true;return}
  let tr;
  const panel=el.closest('.m3-panel');
  if(panel){
    /* đích nằm trong thẻ hướng dẫn: tay đứng BÊN CẠNH (bên trái), chỉ ngang vào hàng cần bấm, không đè lên đáp án */
    const pr=panel.getBoundingClientRect(),room=pr.left-st.left,ty=r.top+r.height/2-st.top;
    if(room>=72)tr=`translate(${(pr.left-st.left-18).toFixed(0)}px,${ty.toFixed(0)}px) rotate(90deg) translate(-23px,-2px)`;
    else tr=`translate(${(r.left-st.left+4).toFixed(0)}px,${ty.toFixed(0)}px) rotate(90deg) scale(.7) translate(-23px,-2px)`;   /* màn hẹp: tay nhỏ ở mép trái */
  }else{
    const low=r.bottom-st.top>st.height-70;                           /* đích trên cảnh gần mép dưới: tay chỉ từ trên xuống */
    const tx=r.left+r.width/2-st.left,ty=(low?r.top:r.bottom)-st.top+(low?4:-6);
    tr=low?`translate(${tx.toFixed(0)}px,${ty.toFixed(0)}px) rotate(180deg) translate(-23px,-2px)`:`translate(${(tx-23).toFixed(0)}px,${(ty-2).toFixed(0)}px)`;
  }
  if(h.hidden)h.hidden=false;
  if(h._tr!==tr){h._tr=tr;h.style.transform=tr}
}
function toggleFs(){
  const el=S.root;
  if(!document.fullscreenElement)(el.requestFullscreen||document.documentElement.requestFullscreen).call(el).catch(()=>{});
  else document.exitFullscreen&&document.exitFullscreen().catch(()=>{});
}
function toggleNarration(){
  S.narrationEnabled=!S.narrationEnabled;refreshNarr();
  if(!S.narrationEnabled){Aud.stop();return}
  speak(S.lastSay);
}
function resetCam(){
  const v=R('view'),asp=v.clientHeight?v.clientWidth/v.clientHeight:1.6;
  /* màn hình dọc/hẹp: camera gần hơn, nhìn chếch xuống để cánh đồng lấp đầy khung */
  const dist=asp<1.25?560:asp<1.5?600:CAM0.dist,pitch=asp<1.25?.62:asp<1.5?.48:CAM0.pitch;
  const c=S.cam;c.yaw=c.tyaw=CAM0.yaw;c.pitch=c.tpitch=pitch;c.dist=c.tdist=dist;
  field.setView(c.yaw,c.pitch,c.dist);
}

/* =====================================================================
   ĐIỀU HƯỚNG
   ===================================================================== */
function renderProgress(){
  R('prog').innerHTML=STAGES.map((s,i)=>`<button class="m3-step ${i<G.stage?'done':''}" type="button" data-step="${i}" aria-pressed="${i===G.stage}"><b>${i<G.stage?CHECK_SVG:i+1}</b><span>${s.short}</span></button>`).join('');
}
function gotoStage(i){
  i=clamp(i,0,STAGES.length-1);
  Aud.stop();T.clearAll();
  G.stage=i;S.lastKey=null;S.lastSay=null;
  R('fld').classList.toggle('on',i<=1);R('pnd').classList.toggle('on',i===2);
  if(i>1)GLS.hide();
  R('view').classList.toggle('orbit',i<=1);
  R('goal').innerHTML='<b>Mục tiêu</b>'+STAGES[i].goal;
  R('chain').hidden=i===1;R('hsl').hidden=i!==2;R('state').hidden=i!==1;
  resetCam();renderProgress();
  if(i===0)enter1();else if(i===1)enter2();else enter3();
  renderPanel();
}
function renderPanel(){
  const p=G.stage===0?panel1():G.stage===1?panel2():panel3();
  R('pbody').innerHTML=p.body;R('pfoot').innerHTML=p.foot;
  R('pbody').scrollTop=0;
  R('cnt').hidden=G.stage!==1;
  if(G.stage===1)updateCounts();
  if(p.say&&p.say!==S.lastSay)speak(p.say);     /* đọc câu hướng dẫn mỗi khi nội dung đổi */
}

/* =====================================================================
   STEP 1 – KHÁM PHÁ CHUỖI THỨC ĂN
   ===================================================================== */
function enter1(){
  Object.assign(S1,{shown:0,seen:{},sel:null,ready:false});
  field.setSnakeCount(0);field.setMouseCount(0,true);field.setHealth(.92);
  R('chain').innerHTML=ORGS.map((o,i)=>(i?`<span class="m3-arrow" data-ar="${i}" aria-hidden="true">→</span>`:'')+
    `<button class="m3-org" type="button" data-act="org" data-i="${i}" tabindex="-1">${ico(o.k)}<span>${o.name}</span><i class="ck">${CHECK_SVG}</i></button>`).join('');
  /* xuất hiện tuần tự */
  T.set(()=>reveal1(1),500);
  T.set(()=>{field.setMouseCount(3,true);reveal1(2)},2100);
  T.set(()=>{field.setSnakeCount(2);reveal1(3)},3700);
  T.set(()=>{S1.ready=true;renderPanel()},4500);
}
function reveal1(n){
  S1.shown=n;
  $$(R('chain'),'.m3-org').forEach((b,i)=>{const on=i<n;b.classList.toggle('show',on);b.tabIndex=on?0:-1});
  $$(R('chain'),'.m3-arrow').forEach(a=>a.classList.toggle('show',+a.dataset.ar<n));
}
function pickOrg(i){
  if(G.stage!==0||i>=S1.shown)return;
  S1.sel=i;S1.seen[i]=true;
  $$(R('chain'),'.m3-org').forEach((b,k)=>{b.classList.toggle('sel',k===i);b.classList.toggle('seen',!!S1.seen[k])});
  renderPanel();
}
function panel1(){
  const n=Object.keys(S1.seen).length,o=S1.sel!=null?ORGS[S1.sel]:null;
  let say;
  if(S1.shown<3)say='Mục tiêu: tìm hiểu các sinh vật ăn nhau như thế nào. Hãy quan sát cánh đồng khoai tây.';
  else if(n===3)say='Cây khoai tây là thức ăn của chuột. Chuột là thức ăn của rắn. Các sinh vật liên hệ với nhau qua thức ăn.';
  else if(o)say=o.name+': '+o.text;
  else say='Nhấn vào từng sinh vật phía trên để xem nó ăn gì.';
  return{say,body:coach(say)+`<p class="m3-note">Mũi tên → chỉ chiều truyền thức ăn · Đã xem ${n}/3</p>`,
   foot:`<button class="m3-btn" type="button" data-act="next" ${S1.ready?'':'disabled'}>Tiếp theo ▶</button>`};
}

/* =====================================================================
   STEP 2 – THÍ NGHIỆM: ĐIỀU GÌ SẼ XẢY RA?
   ===================================================================== */
function enter2(){
  Aud.stop();
  S2.phase='A';S2.t=0;S2.mT=REF.mice;
  field.setSnakeCount(REF.snakes);field.setMouseCount(REF.mice,true);field.setHealth(REF.P);
  setState('A');
}
function setState(k){
  const el=R('state');
  el.textContent={A:'A · Ban đầu',B:'B · Rắn giảm mạnh',C:'C · Khôi phục'}[k];
  el.className='m3-state '+(k==='B'?'b':k==='C'?'c':'');
}
function counts(){return{s:field.activeSnakes(),m:field.activeMice(),p:field.P}}
function updateCounts(){
  const el=R('cnt');if(!el)return;
  const c=counts(),pt=potatoTxt(c.p);
  el.innerHTML=`<div class="m3-crow"><span class="ic">${ico('snake')}</span><b>Rắn</b><span class="dots">${ico('snake').repeat(c.s)}</span><em>${c.s}</em></div>
   <div class="m3-crow"><span class="ic">${ico('mouse')}</span><b>Chuột</b><span class="dots">${ico('mouse').repeat(c.m)}</span><em>${c.m}</em></div>
   <div class="m3-crow"><span class="ic">${ico('potato')}</span><b>Khoai</b><span class="st ${pt[1]}">${pt[0]}</span></div><p class="m3-note">Số liệu mô phỏng</p>`;
}
function pickPred(i){
  if(G.stage!==1||S2.phase!=='A')return;
  S2.pred=i;renderPanel();
}
function startReduce(){
  if(S2.phase!=='A'||S2.pred==null)return;
  Aud.stop();
  S2.phase='Brun';S2.t=0;S2.t0=performance.now();
  field.setSnakeCount(LOW.snakes);
  setState('B');renderPanel();
}
function startRestore(){
  if(S2.phase!=='B')return;
  Aud.stop();
  S2.phase='Crun';S2.t=0;S2.t0=performance.now();
  field.setSnakeCount(REF.snakes);field.setMouseCount(REF.mice);   /* rắn trở lại, bắt dần số chuột dư */
  setState('C');renderPanel();
}
function tick2(d){
  /* thời gian thực: máy yếu vẫn hoàn thành thí nghiệm đúng hạn */
  if(S2.phase==='Brun'||S2.phase==='Crun')S2.t=Math.max(S2.t+d,(performance.now()-S2.t0)/1000);
  if(S2.phase==='Brun'){
    const k=clamp(S2.t/7,0,1);
    const m=Math.round(lerp(REF.mice,LOW.mice,k));
    if(m!==S2.mT){S2.mT=m;field.setMouseCount(m)}
    field.setHealth(lerp(REF.P,LOW.P,k));
    if(S2.t>=7.3){S2.phase='B';renderPanel()}
  }else if(S2.phase==='Crun'){
    const k=clamp(S2.t/7,0,1);
    field.setHealth(lerp(LOW.P,REF.P,k));
    if(S2.t>=7.5){field.setMouseCount(REF.mice,true);field.setHealth(REF.P);S2.phase='C';renderPanel()}
  }
}
function panel2(){
  const ph=S2.phase,pred=S2.pred;
  const wait=`<button class="m3-btn" type="button" disabled>Đang quan sát…</button>`;
  if(ph==='A'){
    const say=(pred==null?'Mục tiêu: xem điều gì xảy ra khi rắn giảm mạnh. ':'')+'Nếu rắn giảm mạnh, chuột và cây khoai tây sẽ thế nào? Hãy chọn một dự đoán.';
    return{say,body:coach(say)+`<div class="m3-opts">${P2_OPTS.map((o,i)=>optBtn(o,i,'pred',pred===i?'picked':'')).join('')}</div>`,
      foot:`<button class="m3-btn warm" type="button" data-act="reduce" ${pred==null?'disabled':''}>Giảm số lượng rắn</button>`};
  }
  if(ph==='Brun'){const say='Rắn đang giảm mạnh. Hãy quan sát chuột và cây khoai tây.';return{say,body:coach(say),foot:wait}}
  if(ph==='B'){
    const ok=pred!=null&&P2_OPTS[pred].ok;
    const say=(ok?'Đúng rồi! ':'Chưa đúng. ')+'Rắn giảm thì chuột tăng, khoai tây bị hại nhiều hơn.';
    return{say,body:coach((ok?'✓ ':'✗ ')+say)+`<div class="m3-res b"><div class="m3-flow">Rắn ↓ <i>→</i> Chuột ↑ <i>→</i> Khoai bị hại</div></div>`,
      foot:`<button class="m3-btn" type="button" data-act="restore">Khôi phục ban đầu</button><button class="m3-btn alt" type="button" data-act="next">Tiếp theo ▶</button>`};
  }
  if(ph==='Crun'){const say='Rắn được khôi phục và bắt bớt chuột.';return{say,body:coach(say),foot:wait}}
  const say='Rắn trở lại thì chuột giảm, khoai tây tốt lại. Các loài phụ thuộc lẫn nhau. Bảo vệ sinh vật giúp giữ cân bằng.';
  return{say,body:coach('Rắn trở lại thì chuột giảm, khoai tây tốt lại. Bảo vệ sinh vật giúp giữ cân bằng.')+`<div class="m3-res"><div class="m3-flow">Rắn ↑ <i>→</i> Chuột ↓ <i>→</i> Khoai tốt lại</div></div>`,
    foot:`<button class="m3-btn alt" type="button" data-act="redo2">↺ Làm lại</button><button class="m3-btn" type="button" data-act="next">Tiếp theo ▶</button>`};
}

/* =====================================================================
   STEP 3 – CON NGƯỜI TÁC ĐỘNG (ao hồ)
   ===================================================================== */
const realSpots=()=>POND_SPOTS.filter(s=>!s.pending);
const allDone=()=>realSpots().every(x=>S3.done[POND_SPOTS.indexOf(x)]);
function spotState(i){
  const s=POND_SPOTS[i];
  if(s.pending)return'pend';
  if(S3.done[i])return'done';
  return POND_SPOTS.slice(0,i).filter(x=>!x.pending).every(x=>S3.done[POND_SPOTS.indexOf(x)])?'open':'lock';
}
function buildHotspots(){
  R('hsl').innerHTML=POND_SPOTS.map((s,i)=>`<button class="m3-hs" type="button" data-act="hs" data-i="${i}" aria-label="Điểm ${s.n}: ${esc(s.label)}">${s.n}<span class="lb">${esc(s.label)}</span></button>`).join('');
}
function refreshHotspots(){
  $$(R('hsl'),'.m3-hs').forEach((b,i)=>{
    const st=spotState(i);
    b.className='m3-hs '+(st==='open'?'':st)+(S3.cur===i?' cur':'');
    b.firstChild.textContent=st==='done'?'✓':POND_SPOTS[i].n;
  });
}
function posHotspots(){
  const svg=R('pnd'),view=R('view');
  const W=view.clientWidth,H=view.clientHeight;if(!W||!H)return;
  const ar=W/H>1.67?'xMidYMin slice':'xMidYMid meet';
  if(ar!==S3.ar){S3.ar=ar;svg.setAttribute('preserveAspectRatio',ar)}
  const m=svg.getScreenCTM(),vr=view.getBoundingClientRect();if(!m)return;
  const pt=svg.createSVGPoint();
  $$(R('hsl'),'.m3-hs').forEach((b,i)=>{
    const s=POND_SPOTS[i];pt.x=s.x;pt.y=s.y;const p=pt.matrixTransform(m);
    b.style.transform=`translate(${(p.x-vr.left).toFixed(1)}px,${(p.y-vr.top).toFixed(1)}px)`;
  });
}
const CHAIN3=[{k:'weed',n:'Thực vật'},{k:'shrimp',n:'Sinh vật nhỏ',hit:1,b:'↓ giảm'},{k:'fish',n:'Cá',hit:0,b:'↓ giảm'},{k:'bird',n:'Cò',hit:2,b:'bỏ đi'}];
function refreshChain3(){
  const sp=POND_SPOTS;
  R('chain').innerHTML=CHAIN3.map((o,i)=>(i?`<span class="m3-arrow show" aria-hidden="true">→</span>`:'')+
    `<div class="m3-org static show ${o.hit!=null&&S3.done[o.hit]?'hit':''}">${ico(o.k)}<span>${o.n}</span><i class="bdg">${o.b||''}</i></div>`).join('');
}
function enter3(){
  refreshChain3();
  Object.assign(S3,{cur:null,h:0,tgt:Object.keys(S3.done).length?1:0,t0:0,key:''});
  pond.set({fish:10,small:6,plant:1,bird:'dip',elec:.35,desat:0});
  refreshHotspots();
  T.set(posHotspots,30);
}
function openSpot(i){
  if(G.stage!==2)return;
  if(spotState(i)==='lock'){toast('Làm lần lượt 1 → 2 → 3.');return}
  S3.cur=i;refreshHotspots();renderPanel();
}
function answerSpot(k){
  const i=S3.cur;if(i==null)return;
  const s=POND_SPOTS[i];if(!s||s.pending||S3.done[i])return;
  const o=s.opts[k];
  S3.pick[i]=k;
  if(o.ok){
    S3.done[i]=true;beep(true);
    if(s.n===1){S3.tgt=1;S3.t0=performance.now()}   /* cá, sinh vật nhỏ giảm dần */
    if(s.n===3)S3.away=true;
    if(allDone())finish();                                                      /* cò bay đi */
  }else{
    S3.wrong[i]=Object.assign(S3.wrong[i]||{},{[k]:true});beep(false);
  }
  refreshHotspots();refreshChain3();renderPanel();
}
function panel3(){
  const all=allDone(),i=S3.cur,s=i!=null?POND_SPOTS[i]:null;
  const nx=realSpots().find(x=>!S3.done[POND_SPOTS.indexOf(x)]);
  const CONCL='Con người có thể làm mất cân bằng chuỗi thức ăn. Hãy bảo vệ sinh vật và môi trường sống.';
  let ask,opts='',fb='',say;
  if(s&&s.pending){ask='Điểm này đang chờ nội dung.';say=ask}
  else if(s){
    const pk=S3.pick[i],wr=S3.wrong[i]||{},done=!!S3.done[i];
    ask=s.q;say=s.q;
    /* đã trả lời đúng: ẩn các đáp án để thẻ gọn, không che mô hình dưới ao */
    if(!done)opts=`<div class="m3-opts">${s.opts.map((o,k)=>optBtn(o,k,'ans3',wr[k]?'wrong':'',wr[k])).join('')}</div>`;
    if(pk!=null){
      const o=s.opts[pk],title=o.ok?'Đúng rồi!':'Chưa đúng, em chọn lại nhé';
      const extra=o.ok?(all?CONCL:`Nhấn điểm ${nx.n} trên ao`):'';
      fb=`<div class="m3-fbcard ${o.ok?'ok':'no'}"><span class="ic">${o.ok?'✓':'✗'}</span><div><h4>${title}</h4><p>${esc(o.why)}</p>${extra?`<div class="${all?'m3-concl2':'m3-next'}">${all?'':'👉 '}${extra}</div>`:''}</div></div>`;
      say=title+'. '+o.why+(extra?'. '+extra:'');
    }
  }else{ask=all?'Em đã khám phá xong!':`Nhấn vào điểm số ${nx.n} trên ao.`;say=all?CONCL:(Object.keys(S3.done).length?'':'Mục tiêu: xem con người làm thay đổi chuỗi thức ăn dưới ao thế nào. ')+ask;if(all)fb=`<div class="m3-fbcard ok"><span class="ic">✓</span><div><h4>${CONCL}</h4></div></div>`}
  return{say,body:coach(ask)+opts+fb,foot:''};
}
function tick3(d){
  /* hậu quả hiện dần ~4,5 giây (thời gian thực) sau khi xong điểm 1 */
  S3.h=S3.tgt?(S3.t0?clamp((performance.now()-S3.t0)/4500,0,1):1):0;
  const h=S3.h;
  const st={fish:Math.round(10-7*h),small:Math.round(6-4*h),plant:Math.round((1-.3*h)*50)/50,
    bird:S3.away?'away':h>.45?'search':'dip',elec:.35,desat:Math.round(h*.7*50)/50};
  const key=JSON.stringify(st);
  if(key!==S3.key){S3.key=key;pond.set(st)}
  pond.update(d);
  posHotspots();
}
function finish(){
  if(!allDone())return;
  if(!G.completed){G.completed=true;S.root.dispatchEvent(new CustomEvent(P+'complete',{bubbles:true,detail:{module:'canBangChuoiThucAn'}}))}
}

/* =====================================================================
   VÒNG LẶP, API MODULE, KHỞI ĐỘNG
   ===================================================================== */
function tickView(dt){
  const c=S.cam,k=Math.min(1,dt*5);
  c.yaw=lerp(c.yaw,c.tyaw,k);c.pitch=lerp(c.pitch,c.tpitch,k);c.dist=lerp(c.dist,c.tdist,k);
  field.setView(c.yaw,c.pitch,c.dist);
}
function tickStage(dt){
  if(G.stage<=1){
    tickView(dt);field.update(dt);
    if(G.stage===1){tick2(dt);S.cntT=(S.cntT||0)+dt;if(S.cntT>.25){S.cntT=0;updateCounts()}}
  }else tick3(dt);
  updateHand();
}
function loop(ts){
  S.raf=requestAnimationFrame(loop);
  const dt=Math.min(.05,Math.max(0,(ts-S.last)/1000));S.last=ts;
  if(S.introOn||!S.active)return;
  tickStage(dt);
}
function startLoop(){if(!S.raf){S.last=performance.now();S.raf=requestAnimationFrame(loop)}}
function stopLoop(){if(S.raf){cancelAnimationFrame(S.raf);S.raf=0}}

function introStart(){
  S.hint=true;refreshHint();
  R('intro').classList.remove('on');S.introOn=false;
  resetState();
  mod.activate(0);
}

const mod={
  key:'canBangChuoiThucAn',
  stepLabels:STEP_LABELS.slice(),
  init(){build();return Promise.resolve()},
  showIntro(){
    build();S.root.hidden=false;S.active=false;S.introOn=true;
    R('intro').classList.add('on');startLoop();
  },
  activate(localIndex){
    build();
    S.root.hidden=false;R('intro').classList.remove('on');S.introOn=false;
    S.active=true;startLoop();refreshNarr();
    gotoStage(typeof localIndex==='number'?localIndex:0);
    return Promise.resolve();
  },
  gotoLocalStep(localIndex){gotoStage(localIndex);return Promise.resolve()},
  /* trợ giúp kiểm thử */
  _advance(sec){const n=Math.ceil(sec/.05);for(let i=0;i<n&&S.active;i++)tickStage(.05)},
  _state(){return{stage:G.stage,completed:G.completed,S2:{phase:S2.phase,pred:S2.pred},S3:{done:Object.assign({},S3.done)}}},
  deactivate(){
    if(!S.built)return;
    S.active=false;S.introOn=false;stopLoop();
    Aud.stop();T.clearAll();
    S.root.classList.remove('m3-playing');GLS.hide();
    S.root.hidden=true;
  }
};
window.LessonModules=window.LessonModules||{};
window.LessonModules.canBangChuoiThucAn=mod;

if(!window.KH4B30_M03_MANUAL){
  const boot=()=>mod.showIntro();
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
}
})();

</script>
