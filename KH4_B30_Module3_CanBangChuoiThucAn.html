<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Bài 30 – Vai trò của thực vật trong chuỗi thức ăn | YooBook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
html,body{height:100%;margin:0}
body{font-family:'Roboto',system-ui,-apple-system,Segoe UI,sans-serif;background:#195658;overflow:hidden;overscroll-behavior:none}

/* ===== Module 3 – namespace: kh4b30-m03- (root class) / m3- (lớp con) ===== */
.kh4b30-m03-root{
  --brand:#195658;--brand-dark:#0f3f3d;--brand-light:#2f827d;--brand-soft:#e6f0ee;
  --ink:#10302d;--muted:#5f8b89;--line:#dbe8e5;--bg:#eaf3f1;--gold:#a8814a;
  --ok:#2e9d5b;--bad:#d4493f;--r:16px;--r-sm:11px;
  --sh-1:0 1px 2px rgba(13,42,40,.05);
  --sh-2:0 2px 6px rgba(13,42,40,.06),0 18px 34px -22px rgba(13,42,40,.45);
  --sh-3:0 10px 30px -12px rgba(13,42,40,.32);
  position:fixed;inset:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  font-family:'Roboto',system-ui,-apple-system,Segoe UI,sans-serif;font-size:15px;line-height:1.45;color:var(--ink);
  background:#195658;-webkit-tap-highlight-color:transparent;z-index:1;
}
.kh4b30-m03-root.m3-embedded{position:relative;inset:auto;height:100%}
.kh4b30-m03-root *{box-sizing:border-box}
.kh4b30-m03-root button{font-family:inherit}
.kh4b30-m03-root[hidden]{display:none}
.m3-defs{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}

/* header */
.m3-top{display:flex;align-items:center;gap:12px;padding:8px 16px;background:#fff;border-bottom:1px solid var(--line);box-shadow:var(--sh-1);flex:0 0 auto;z-index:20}
.m3-logo{height:27px;display:block;flex:0 0 auto}
.m3-titles{flex:1;min-width:0}
.m3-badge{display:inline-block;max-width:100%;font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--brand);background:var(--brand-soft);border-radius:99px;padding:1px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:top}
.m3-titles h1{margin:1px 0 0;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m3-tbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--brand-dark)}
.m3-tbtn:hover{background:var(--brand-soft);border-color:var(--brand-light)}

/* khung chính */
.m3-main{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px;overflow:hidden}
.m3-frame{background:#fff;border-radius:var(--r);box-shadow:var(--sh-2);display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
.m3-stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(290px,25vw,360px);background:#195658}
.m3-view{position:relative;min-width:0;min-height:0;overflow:hidden;background:#cfe6ea;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.m3-view.dragging{cursor:grabbing}
.m3-host{position:absolute;inset:0}
.m3-scene{position:absolute;inset:0;width:100%;height:100%;display:none}
.m3-scene.on{display:block}
.m3-scene .L-bg{transform:translate(calc(var(--px,0) * -12px),calc(var(--py,0) * -3px))}
.m3-scene .L-mid{transform:translate(calc(var(--px,0) * -6px),calc(var(--py,0) * -2px))}
.m3-scene .L-fore{transform:translate(calc(var(--px,0) * 6px),calc(var(--py,0) * 3px))}
.m3-scene .L-act{transform:translate(calc(var(--px,0) * 6px),calc(var(--py,0) * 3px))}
.m3-scene .L-mice{transform:translate(calc(var(--px,0) * 6px),calc(var(--py,0) * 3px))}
.m3-scene .L-snakes{transform:translate(calc(var(--px,0) * 6px),calc(var(--py,0) * 3px))}
.m3-scene .L-w1{transform:translate(calc(var(--px,0) * -10px),calc(var(--py,0) * -2px))}
.m3-scene .L-w2{transform:translate(calc(var(--px,0) * -4px),calc(var(--py,0) * -1px))}
.m3-scene .L-w3{transform:translate(calc(var(--px,0) * 8px),calc(var(--py,0) * 2px))}
.m3-gl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:none}
.kh4b30-m03-root .mp0{fill:var(--mc0,#3f8a3e)}.kh4b30-m03-root .mp1{fill:var(--mc1,#5fae4a)}.kh4b30-m03-root .mp2{fill:var(--mc2,#4ea044)}
.m3-paused *{animation-play-state:paused!important}
.m3-frozen *{animation-play-state:paused!important}

/* thanh công cụ */
.m3-tools{position:absolute;left:12px;top:12px;z-index:6;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100% - 24px)}
.m3-ghost{background:rgba(255,255,255,.92);backdrop-filter:blur(8px) saturate(1.3);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 11px;font-size:12.5px;font-weight:500;color:var(--brand-dark);cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:var(--sh-1);white-space:nowrap}
.m3-ghost:hover{background:#fff;border-color:var(--brand-light)}
.m3-ghost[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.m3-ghost svg{flex:0 0 auto}
.m3-ghost[hidden]{display:none}
.m3-wave{display:none;width:14px;height:12px;align-items:flex-end;gap:2px}
.m3-wave i{display:block;width:2px;background:#fff;border-radius:2px;animation:m3wave .8s ease-in-out infinite}
.m3-wave i:nth-child(2){animation-delay:.2s}.m3-wave i:nth-child(3){animation-delay:.4s}
.m3-playing .m3-wave{display:flex}
@keyframes m3wave{0%,100%{height:3px}50%{height:12px}}

.m3-nav{position:absolute;top:50%;z-index:30;transform:translateY(-50%);width:38px;height:38px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.9);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--brand-dark);box-shadow:var(--sh-1);font-size:16px}
.m3-nav.prev{left:10px}.m3-nav.next{right:10px}.m3-nav[disabled]{opacity:.3;pointer-events:none}
.m3-nav:hover{background:#fff;border-color:var(--brand-light)}

/* tab step 10 */
.m3-tabs{position:absolute;right:12px;top:12px;z-index:6;display:none;gap:6px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);padding:4px;border-radius:99px;box-shadow:var(--sh-1);border:1px solid var(--line)}
.m3-tabs.on{display:flex}
.m3-tabs.on~.m3-clock{top:58px}
.m3-tab{border:none;background:transparent;padding:6px 14px;border-radius:99px;font-weight:600;font-size:13px;color:var(--brand-dark);cursor:pointer;display:flex;align-items:center;gap:6px}
.m3-tab[aria-selected="true"]{background:var(--brand);color:#fff}
.m3-tab .ck{width:16px;height:16px;border-radius:99px;background:var(--ok);color:#fff;display:none;align-items:center;justify-content:center}
.m3-tab.done .ck{display:flex}

/* đồng hồ */
.m3-clock{position:absolute;right:12px;top:12px;z-index:6;display:none;align-items:center;gap:8px;background:rgba(255,255,255,.93);backdrop-filter:blur(8px);border-radius:var(--r-sm);padding:6px 12px;box-shadow:var(--sh-1);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--brand-dark)}
.m3-clock.on{display:flex}
.m3-clock .bar{width:78px;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.m3-clock .bar span{display:block;height:100%;width:0;background:var(--brand);border-radius:99px}
.m3-badge-st{position:absolute;left:12px;bottom:12px;z-index:6;background:rgba(255,255,255,.93);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--brand-dark);box-shadow:var(--sh-1);display:none;max-width:60%}
.m3-badge-st.on{display:block}

/* panel phải */
.m3-panel{background:linear-gradient(180deg,#f8fcfb,#eef6f4);border-left:1px solid var(--line);min-height:0;overflow:auto;padding:10px 14px;scrollbar-width:thin}
.m3-pane{display:none;flex-direction:column;gap:7px}
.m3-pane.on{display:flex}
.m3-kick{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.m3-ptitle{font-size:15.5px;font-weight:800;color:var(--brand-dark);line-height:1.25;margin:0}
.m3-pdesc{margin:0;font-size:13px;color:#2d5552;line-height:1.45}
.m3-card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:8px 12px;box-shadow:var(--sh-1)}
.m3-sl-head{display:flex;align-items:baseline;justify-content:space-between;font-weight:700;font-size:14px;color:var(--brand-dark)}
.m3-sl-head b{font-size:21px;color:var(--brand)}
.m3-range{width:100%;margin:6px 0 0;accent-color:var(--brand);height:24px;cursor:pointer}
.m3-sl-scale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:-2px;padding:0 3px}
.m3-note{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.35}
.m3-btnrow{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.m3-btn{border:none;border-radius:11px;background:var(--brand);color:#fff;font-weight:700;font-size:13px;padding:9px 12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 2px 0 rgba(0,0,0,.14);transition:background .15s,transform .1s}
.m3-btn:hover{background:var(--brand-light)}
.m3-btn:active{transform:translateY(1px)}
.m3-btn.full{grid-column:1/-1}
.m3-btn.alt{background:#fff;color:var(--brand-dark);border:1.5px solid var(--brand-light);box-shadow:none}
.m3-btn.alt:hover{background:var(--brand-soft)}
.m3-btn.gold{background:var(--gold)}.m3-btn.gold:hover{background:#b8925a}
.m3-btn[disabled]{opacity:.42;pointer-events:none}
.m3-btn[hidden]{display:none}
.m3-live{display:flex;flex-direction:column;gap:7px}
.m3-row{display:flex;align-items:center;gap:8px;font-size:12.5px}
.m3-row .ic{width:26px;height:26px;border-radius:8px;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.m3-row .ic svg{width:20px;height:20px}
.m3-row .nm{font-weight:600;min-width:62px;color:var(--brand-dark)}
.m3-row .bar{flex:1;height:8px;border-radius:99px;background:#e4eeec;overflow:hidden}
.m3-row .bar span{display:block;height:100%;width:50%;border-radius:99px;background:linear-gradient(90deg,#5aa86e,#2e8c58);transition:width .5s}
.m3-row .bar span.warn{background:linear-gradient(90deg,#e0a24a,#d6742f)}
.m3-row .bar span.bad{background:linear-gradient(90deg,#e0695a,#c8372e)}
.m3-row .st{min-width:68px;text-align:right;font-weight:600;font-size:11.5px;color:#356a66}
.m3-prog{height:6px;border-radius:99px;background:#e4eeec;overflow:hidden}
.m3-prog span{display:block;height:100%;width:0;background:var(--brand)}
.m3-res{border-radius:13px;padding:10px 12px;background:#fff7e8;border:1px solid #f0d9a8;animation:m3in .35s ease}
.m3-res h4{margin:0 0 4px;font-size:12.5px;color:#7a5a1d;font-weight:800;letter-spacing:.02em}
.m3-res ul{margin:0;padding-left:17px;font-size:12.5px;color:#4a3a14}
.m3-res li{margin:1px 0}
.m3-res.ref{background:#eaf6f0;border-color:#bfe0cf}.m3-res.ref h4{color:#1d6b46}.m3-res.ref ul{color:#1e4a37}
.m3-res.up{background:#eaf3fb;border-color:#bcd6ee}.m3-res.up h4{color:#235f8d}.m3-res.up ul{color:#1d4261}
.m3-res[hidden]{display:none}
@keyframes m3in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.m3-info{border-radius:13px;padding:9px 12px;background:#fff7e8;border:1px solid #f0d9a8;font-size:12.5px;color:#4a3a14;animation:m3in .35s ease}
.m3-info.good{background:#eaf6f0;border-color:#bfe0cf;color:#1e4a37}
.m3-info[hidden]{display:none}
.m3-switch{display:flex;align-items:center;justify-content:space-between;gap:10px}
.m3-switch .lbl{font-weight:700;font-size:13.5px;color:var(--brand-dark)}
.m3-sw{position:relative;width:96px;height:34px;border-radius:99px;border:none;background:#b9c9c6;cursor:pointer;padding:0;transition:background .25s;flex:0 0 auto;color:#fff;font-weight:700;font-size:12px}
.m3-sw::after{content:"";position:absolute;left:3px;top:3px;width:28px;height:28px;border-radius:99px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .25s}
.m3-sw span{position:absolute;top:0;bottom:0;display:flex;align-items:center}
.m3-sw .t-off{right:12px}.m3-sw .t-on{left:12px;opacity:0}
.m3-sw[aria-checked="true"]{background:#d6742f}
.m3-sw[aria-checked="true"].safe{background:var(--ok)}
.m3-sw[aria-checked="true"]::after{left:65px}
.m3-sw[aria-checked="true"] .t-off{opacity:0}.m3-sw[aria-checked="true"] .t-on{opacity:1}
.m3-ba{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.m3-ba figure{margin:0;position:relative;border-radius:9px;overflow:hidden;border:1px solid var(--line);background:#dfeee9;aspect-ratio:5/3}
.m3-ba figure svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.m3-ba figcaption{position:absolute;left:5px;top:5px;background:rgba(15,63,61,.82);color:#fff;font-size:10.5px;font-weight:700;border-radius:99px;padding:1px 8px}
.m3-ba .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);text-align:center;padding:6px}
.m3-chips{display:flex;gap:6px;flex-wrap:wrap}
.m3-chip{font-size:11.5px;font-weight:600;border-radius:99px;padding:3px 10px;background:#e9f0ee;color:#5c7a77;display:flex;align-items:center;gap:5px}
.m3-chip.done{background:#dff3e6;color:#1d6b46}
.m3-chip svg{display:none}.m3-chip.done svg{display:block}

/* popup */
.m3-ov{position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:20px 60px;background:rgba(10,45,43,.5);backdrop-filter:blur(3px)}
.m3-ov.on{display:flex;animation:m3fade .25s ease}
@keyframes m3fade{from{opacity:0}to{opacity:1}}
.m3-kn{width:min(600px,100%);background:#fff;border-radius:18px;box-shadow:var(--sh-3);overflow:hidden;animation:m3in .3s ease}
.m3-kn header{background:var(--brand);color:#fff;padding:13px 20px;display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.06em;font-size:15px}
.m3-kn header svg{flex:0 0 auto}
.m3-kn .bd{padding:18px 22px 8px;display:flex;flex-direction:column;gap:12px}
.m3-kn blockquote{margin:0;padding:12px 16px;background:var(--brand-soft);border-left:5px solid var(--brand);border-radius:10px;font-size:17px;line-height:1.5;color:var(--brand-dark);font-weight:500}
.m3-kn .ft{display:flex;gap:8px;justify-content:flex-end;padding:8px 22px 18px}
.m3-kn .ft .m3-btn{padding:9px 18px}
.m3-cmp{width:min(860px,100%);max-height:100%;background:#fff;border-radius:18px;box-shadow:var(--sh-3);display:flex;flex-direction:column;overflow:hidden;animation:m3in .3s ease}
.m3-cmp header{background:var(--brand);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.05em;font-size:14px}
.m3-cmp header .sp{flex:1}
.m3-cmp header select{font-family:inherit;border-radius:8px;border:none;padding:3px 6px;font-size:12px;font-weight:600}
.m3-cmp .bd{padding:12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:0;overflow:auto}
.m3-cs{border:1.5px solid var(--line);border-radius:13px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.m3-cs .tag{font-weight:800;font-size:13px;color:var(--brand-dark);display:flex;justify-content:space-between}
.m3-cs .tag em{font-style:normal;font-size:11px;color:var(--muted);font-weight:600}
.m3-cs .th{position:relative;border-radius:9px;overflow:hidden;aspect-ratio:5/3;background:#dfeee9}
.m3-cs .th svg{position:absolute;inset:0;width:100%;height:100%}
.m3-cs .kv{display:flex;align-items:center;gap:7px;font-size:12.5px}
.m3-cs .kv .ic{width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.m3-cs .kv .ic svg{width:18px;height:18px}
.m3-cs .kv b{min-width:56px;color:var(--brand-dark)}
.m3-cs .kv .dots{display:flex;flex-wrap:wrap;gap:1px;flex:1}
.m3-cs .kv .dots svg{width:14px;height:14px}
.m3-cs .kv .tx{font-weight:600}
.m3-cs .chg{font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px}
.m3-cs .chg.up{background:#fde8d4;color:#a8501b}.m3-cs .chg.dn{background:#dcebf7;color:#235f8d}.m3-cs .chg.eq{background:#e8efed;color:#5c7a77}
.m3-cmp .sum{margin:0 16px;padding:9px 12px;background:#fff7e8;border:1px solid #f0d9a8;border-radius:11px;font-size:12.5px;color:#4a3a14}
.m3-cmp .ft{display:flex;gap:8px;justify-content:flex-end;padding:10px 16px 14px}
.m3-toast{position:absolute;left:50%;bottom:16px;transform:translate(-50%,20px);z-index:50;background:rgba(15,63,61,.94);color:#fff;font-size:12.5px;font-weight:500;padding:8px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:all .3s;max-width:80%;text-align:center}
.m3-toast.on{opacity:1;transform:translate(-50%,0)}

/* thanh step */
.m3-steps{display:flex;gap:8px;padding:8px 12px;overflow-x:auto;overflow-y:hidden;border-top:1px solid var(--line);scrollbar-width:none;flex:0 0 auto;background:#fff}
.m3-steps::-webkit-scrollbar{display:none}
.m3-step{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:6px 13px 6px 7px;border-radius:99px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap}
.m3-step b{width:20px;height:20px;border-radius:99px;background:var(--brand-soft);color:var(--brand-dark);font-size:11px;display:flex;align-items:center;justify-content:center}
.m3-step[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.m3-step[aria-pressed="true"] b{background:rgba(255,255,255,.25);color:#fff}

/* step 11 – luyện tập */
.m3-practice{position:absolute;inset:0;z-index:4;display:none;flex-direction:column;padding:60px 64px 14px;background:linear-gradient(180deg,#e7f3ee,#d5e9e1);cursor:default;touch-action:auto;overflow:hidden}
.m3-practice.on{display:flex}
.m3-practice::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 12% 88%,rgba(111,168,91,.22),transparent 38%),radial-gradient(circle at 92% 12%,rgba(255,255,255,.7),transparent 35%);pointer-events:none}
.m3-pcard{position:relative;flex:1;min-height:0;background:#fff;border-radius:18px;box-shadow:var(--sh-2);padding:12px 18px 12px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.m3-qhead{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.m3-qdots{display:flex;gap:6px}
.m3-qdot{width:26px;height:26px;border-radius:99px;border:2px solid var(--line);background:#fff;color:var(--muted);font-weight:700;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.m3-qdot.cur{border-color:var(--brand);background:var(--brand);color:#fff}
.m3-qdot.done{border-color:var(--ok);background:var(--ok);color:#fff}
.m3-qdot[disabled]{opacity:.4;cursor:default}
.m3-qtitle{font-size:18px;font-weight:800;color:var(--brand-dark);margin:0;line-height:1.25}
.m3-qsub{font-size:12.5px;color:var(--muted);margin:0}
.m3-board{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}

<script>
(function(){
'use strict';
/* =====================================================================
   MODULE 3 – CÂN BẰNG CHUỖI THỨC ĂN  (Bài 30, Khoa học 4)  – Step 9, 10, 11
   Namespace: kh4b30-m03-   |   window.LessonModules.canBangChuoiThucAn
   Toàn bộ hình ảnh là HTML/CSS/SVG nội tuyến – không GLB/Three.js/WebGL.
   ===================================================================== */
const P='kh4b30-m03-';
const u=n=>`url(#${P}${n})`;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const $=(r,s)=>r.querySelector(s);
const $$=(r,s)=>[...r.querySelectorAll(s)];
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hexRgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function mix(c1,c2,t){const a=hexRgb(c1),b=hexRgb(c2);return `rgb(${Math.round(lerp(a[0],b[0],t))},${Math.round(lerp(a[1],b[1],t))},${Math.round(lerp(a[2],b[2],t))})`}
const f1=n=>n.toFixed(1);
function blob(cx,cy,rx,ry,n,seed,jit){
  const r=rng(seed),p=[];
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2,k=1+(r()-.5)*jit;p.push([cx+Math.cos(a)*rx*k,cy+Math.sin(a)*ry*k])}
  let d=`M${f1(p[0][0])} ${f1(p[0][1])}`;
  for(let i=0;i<n;i++){
    const p0=p[(i-1+n)%n],p1=p[i],p2=p[(i+1)%n],p3=p[(i+2)%n];
    d+=`C${f1(p1[0]+(p2[0]-p0[0])/6)} ${f1(p1[1]+(p2[1]-p0[1])/6)} ${f1(p2[0]-(p3[0]-p1[0])/6)} ${f1(p2[1]-(p3[1]-p1[1])/6)} ${f1(p2[0])} ${f1(p2[1])}`;
  }
  return d+'Z';
}

/* ---------------- AUDIO_REGISTRY: nơi DUY NHẤT lưu tên file + URL ---------------- */
const AUDIO_REGISTRY={
  S09_Voice:{filename:"KH4_B30_M03_S09_Voice.mp3",url:"https://assets.yoolife.com.vn/yootek/1792045080006-3710.mp3"},
  S09_RanGiam:{filename:"KH4_B30_M03_S09_RanGiam.mp3",url:"https://assets.yoolife.com.vn/yootek/1792045071804-5917.mp3"},
  S09_RanTang:{filename:"KH4_B30_M03_S09_RanTang.mp3",url:"https://assets.yoolife.com.vn/yootek/1792045075896-5030.mp3"},
  S09_KetLuan:{filename:"KH4_B30_M03_S09_KetLuan.mp3",url:"https://assets.yoolife.com.vn/yootek/1792045067218-1319.mp3"},
  S10_Voice:{filename:"KH4_B30_M03_S10_Voice.mp3",url:"https://assets.yoolife.com.vn/yootek/1792045100083-6633.mp3"},
  S10_SanBatRan:{filename:"KH4_B30_M03_S10_SanBatRan.mp3",url:"https://assets.yoolife.com.vn/yootek/1792045096137-1197.mp3"},
  S10_DanhBatDien:{filename:"KH4_B30_M03_S10_DanhBatDien.mp3",url:"https://assets.yoolife.com.vn/yootek/1792045087949-8299.mp3"},
  S10_BaoVeRung:{filename:"KH4_B30_M03_S10_BaoVeRung.mp3",url:"https://assets.yoolife.com.vn/yootek/1792045083948-7931.mp3"},
  S10_KetLuan:{filename:"KH4_B30_M03_S10_KetLuan.mp3",url:"https://assets.yoolife.com.vn/yootek/1792045091934-3379.mp3"},
  S11_Voice:{filename:"KH4_B30_M03_S11_Voice.mp3",url:"https://assets.yoolife.com.vn/yootek/1792045116010-3357.mp3"},
  S11_Q01:{filename:"KH4_B30_M03_S11_Q01.mp3",url:"https://assets.yoolife.com.vn/yootek/1792045108128-4986.mp3"},
  S11_Q02:{filename:"KH4_B30_M03_S11_Q02.mp3",url:"https://assets.yoolife.com.vn/yootek/1792045112026-1833.mp3"},
  S11_KetLuan:{filename:"KH4_B30_M03_S11_KetLuan.mp3",url:"https://assets.yoolife.com.vn/yootek/1792045104168-1463.mp3"}
};

/* ---------------- Trạng thái chung ---------------- */
const S={
  root:null,built:false,active:false,step:0,
  narrationEnabled:true,isPlaying:false,paused:false,
  px:0,py:0,tpx:0,tpy:0,auto:false,autoT:0,raf:0,last:0,
  lastKey:null,introOn:false,cam:{yaw:0,pitch:.36,dist:640,tyaw:0,tpitch:.36,tdist:640}
};
const T={ids:new Set(),
  set(fn,ms){const id=setTimeout(()=>{T.ids.delete(id);fn()},ms);T.ids.add(id);return id},
  clearAll(){T.ids.forEach(clearTimeout);T.ids.clear()}};

/* ---------------- Âm thanh: quản lý duy nhất ---------------- */
const Aud={el:null,token:0,
  stop(){
    this.token++;
    if(this.el){const a=this.el;this.el=null;a.onended=a.onerror=a.onplaying=null;try{a.pause()}catch(e){}}
    setPlaying(false);
  },
  /* trả về true nếu có file thật được phát */
  play(key,opt){
    opt=opt||{};
    this.stop();
    const tok=this.token;
    S.lastKey=key;
    if(!opt.force&&!S.narrationEnabled)return false;
    const url=(AUDIO_REGISTRY[key]||{}).url;
    if(!url){ // chưa có audio: bỏ qua nhưng luồng bài học vẫn tiếp tục
      if(opt.onEnd)T.set(()=>{if(tok===this.token)opt.onEnd()},0);
      return false;
    }
    const a=new Audio();a.preload='auto';a.src=url;this.el=a;
    a.onplaying=()=>{if(tok===this.token)setPlaying(true)};
    const fin=()=>{if(tok!==this.token)return;this.el=null;setPlaying(false);if(opt.onEnd)opt.onEnd()};
    a.onended=fin;a.onerror=fin;
    const pr=a.play();
    if(pr&&pr.catch)pr.catch(err=>{
      if(tok!==this.token)return;
      setPlaying(false);
      if(err&&err.name==='NotAllowedError')toast('Nhấn nút Thuyết minh để nghe giọng đọc.');
    });
    return true;
  }
};
function setPlaying(v){
  S.isPlaying=!!v;
  if(S.root)S.root.classList.toggle('m3-playing',!!v&&S.narrationEnabled);
}

/* ---------------- Âm báo đúng/sai (WebAudio, không phải giọng đọc) ---------------- */
let actx=null;
function beep(ok){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const seq=ok?[[660,0],[880,.12]]:[[220,0],[170,.14]];
    seq.forEach(([f,d])=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type=ok?'sine':'triangle';o.frequency.value=f;
      g.gain.setValueAtTime(0,actx.currentTime+d);
      g.gain.linearRampToValueAtTime(.12,actx.currentTime+d+.02);
      g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d+.22);
      o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+d);o.stop(actx.currentTime+d+.25);
    });
  }catch(e){}
}

/* =====================================================================
   DEFS DÙNG CHUNG (gradient + icon)
   ===================================================================== */
function defsMarkup(){
  const lg=(id,st,x2,y2)=>`<linearGradient id="${P}${id}" x1="0" y1="0" x2="${x2||0}" y2="${y2==null?1:y2}">${st.map(s=>`<stop offset="${s[0]}" stop-color="${s[1]}"${s[2]!=null?` stop-opacity="${s[2]}"`:''}/>`).join('')}</linearGradient>`;
  const rg=(id,st)=>`<radialGradient id="${P}${id}">${st.map(s=>`<stop offset="${s[0]}" stop-color="${s[1]}"${s[2]!=null?` stop-opacity="${s[2]}"`:''}/>`).join('')}</radialGradient>`;
  return `<defs>
  ${lg('sky',[[0,'#6fbfee'],[.62,'#b9e3f6'],[1,'#e9f7fb']])}
  ${rg('sun',[[0,'#fffbd0'],[.3,'#ffe98f'],[1,'#ffe58a',0]])}
  ${lg('hillFar',[[0,'#a5cfb4'],[1,'#c6e2cb']])}
  ${lg('hillNear',[[0,'#7fb97a'],[1,'#a9d194']])}
  ${lg('ground',[[0,'#b4d287'],[.22,'#a9c777'],[.55,'#c9b37b'],[1,'#b98f5d']])}
  ${lg('ridge',[[0,'#7b5737'],[.45,'#a67d52'],[1,'#85603d']],1,0)}
  ${lg('blockTop',[[0,'#93b862'],[1,'#78a04c']])}

function compLeaf(L,seed){
  const r=rng(seed);

  const n=4;
  for(let k=0;k<n;k++){

    }

/* =====================================================================
   RẮN 3D (GLB) – Three.js phủ lên cảnh SVG, cùng camera với phép chiếu SVG.
   Chuyển động rắn vẫn do mô phỏng điều khiển: các xương của mô hình bám theo
   đường bò (trail + uốn lượn + ngẩng đầu) của từng con rắn.
   Nếu không tải được Three.js / GLB thì giữ nguyên rắn SVG dự phòng.
   ===================================================================== */
const SNAKE_GLB='https://3d-cdn.yoolife.com.vn/FCVfXG7cE3ZYLRgDB8/FCVfXG7cE3ZYLRgDB8.glb';
const MOUSE_GLB='https://3d-cdn.yoolife.com.vn/QePAtmWxreuXXf4gTO/QePAtmWxreuXXf4gTO.glb';
const SNAKE_LEN=190;                                /* chiều dài thân rắn (cố định) trong thế giới */
const MOUSE_LEN=62;                                 /* chiều dài chuột (gồm đuôi) trong thế giới */
const SNAKE_CHAIN=['Bone005_018','Bone004_017','Bone003_016','Bone002_015','Bone001_014','Bone006_00','Bone007_01','Bone008_02','Bone009_03','Bone010_04','Bone011_05','Bone012_06','Bone013_07','Bone014_08','Bone015_09','Bone016_010','Bone017_011','Bone018_012','Bone019_013'];
/* =====================================================================
   RẮN + CHUỘT 3D (GLB) – Three.js phủ lên cảnh SVG, cùng camera với phép chiếu SVG.
   • Rắn: các xương bám theo đường bò do mô phỏng điều khiển (độ dài cố định).
   • Chuột: phát animation "walk" của mô hình theo tốc độ di chuyển, quay theo hướng đi.
   Nếu không tải được thì giữ nguyên mô hình SVG dự phòng.
   ===================================================================== */
const GLS={
  state:'idle',snake:false,mouse:false,T:null,SU:null,canvas:null,renderer:null,scene:null,camera:null,
  tplS:null,tplM:null,rest:null,mrest:null,scenes:new Set(),active:null,W:0,H:0,shown:false,
  init(canvas){
    if(this.state!=='idle')return;
    this.canvas=canvas;this.state='loading';
    Promise.all([import('three'),import('three/addons/loaders/GLTFLoader.js'),import('three/addons/utils/SkeletonUtils.js')]).then(([T,L,SU])=>{
      this.T=T;this.SU=SU;
      const loader=new L.GLTFLoader();
      const ps=loader.loadAsync(SNAKE_GLB).then(g=>{this.base();this.setupSnake(g);this.snake=true;this.state='ready';this.scenes.forEach(s=>s.glAttachAll&&s.glAttachAll())}).catch(e=>console.warn('Không tải được rắn 3D (GLB), dùng rắn SVG dự phòng.',e));
      const pm=loader.loadAsync(MOUSE_GLB).then(g=>{this.base();this.setupMouse(g);this.mouse=true;this.state='ready';this.scenes.forEach(s=>s.glAttachAll&&s.glAttachAll())}).catch(e=>console.warn('Không tải được chuột 3D (GLB), dùng chuột SVG dự phòng.',e));
      return Promise.all([ps,pm]);
    }).catch(e=>{this.state='failed';console.warn('Không tải được Three.js, dùng mô hình SVG dự phòng.',e)});
  },
  base(){
    if(this.renderer)return;
    const T=this.T;
    this.renderer=new T.WebGLRenderer({canvas:this.canvas,alpha:true,antialias:true});
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    this.renderer.setClearColor(0x000000,0);
    this.scene=new T.Scene();
    this.scene.add(new T.HemisphereLight(0xffffff,0x6f8a58,1.35));
    const dl=new T.DirectionalLight(0xfff0cf,1.9);dl.position.set(-300,520,380);this.scene.add(dl);
    this.scene.updateMatrixWorld(true);this.scene.matrixWorldAutoUpdate=false;   /* ma trận do mình tự cập nhật */
    this.camera=new T.PerspectiveCamera(40,1,5,7000);
  },
  firstSkinned(root){let m=null;root.traverse(n=>{if(n.isSkinnedMesh&&!m)m=n});return m},
  setupSnake(gltf){
    const T=this.T;
    gltf.scene.updateMatrixWorld(true);
    const mesh=this.firstSkinned(gltf.scene),bones=mesh.skeleton.bones,byName={};bones.forEach((b,i)=>{byName[b.name]=i});
    const chain=SNAKE_CHAIN.map(n=>byName[n]);
    if(chain.some(c=>c==null))throw new Error('Khung xương rắn không khớp');
    const pos=chain.map(i=>new T.Vector3().setFromMatrixPosition(bones[i].matrixWorld)),up0=new T.Vector3(0,1,0);
    const frameOf=(f,P,sc)=>{
      const r=new T.Vector3().crossVectors(f,up0).normalize(),u=new T.Vector3().crossVectors(r,f);
      return new T.Matrix4().makeBasis(r.multiplyScalar(sc),u.multiplyScalar(sc),f.clone().multiplyScalar(sc)).setPosition(P);
    };
    const sRest=[0];for(let i=1;i<pos.length;i++)sRest.push(sRest[i-1]+pos[i].distanceTo(pos[i-1]));
    this.rest={chain,sRest,total:sRest[sRest.length-1],hoff:2.6,
      inv:chain.map((bi,c)=>{
        const a=pos[Math.max(0,c-1)],b=pos[Math.min(pos.length-1,c+1)];
        const f=new T.Vector3().subVectors(a,b);if(f.lengthSq()<1e-8)f.set(0,0,1);f.normalize();
        return frameOf(f,pos[c],1).invert();
      }),
      B:chain.map(bi=>bones[bi].matrixWorld.clone()),frameOf};
    this.tplS=gltf.scene;
  },
  setupMouse(gltf){
    const T=this.T;
    gltf.scene.updateMatrixWorld(true);
    const box=new T.Box3().setFromObject(gltf.scene),sz=box.getSize(new T.Vector3()),c=box.getCenter(new T.Vector3());
    const k=MOUSE_LEN/Math.max(sz.z,sz.x,1e-6);
    this.mrest={k,cx:c.x,cz:c.z,clip:gltf.animations.find(a=>/walk|run/i.test(a.name))||gltf.animations[0]||null};
    this.tplM=gltf.scene;
  },
  makeSnake(){
    const root=this.SU.clone(this.tplS),mesh=this.firstSkinned(root);
    mesh.frustumCulled=false;
    this.scene.add(root);root.updateMatrixWorld(true);
    return{root,mesh,bones:mesh.skeleton.bones};
  },
  makeMouse(){
    const T=this.T,M=this.mrest,root=this.SU.clone(this.tplM),grp=new T.Group(),inner=new T.Group();
    root.traverse(n=>{if(n.isMesh)n.frustumCulled=false});
    inner.add(root);inner.scale.setScalar(M.k);inner.position.set(-M.cx*M.k,0,-M.cz*M.k);
    grp.add(inner);grp.rotation.order='YXZ';
    let mixer=null,act=null;
    if(M.clip){mixer=new T.AnimationMixer(root);act=mixer.clipAction(M.clip);act.play()}
    this.scene.add(grp);grp.updateMatrixWorld(true);
    return{root:grp,grp,mixer,act,phase:Math.random()*10};
  },
  dispose(g){if(g&&g.root)g.root.removeFromParent()},
  /* đặt các xương rắn dọc theo đường đi (wpts: đầu → đuôi, toạ độ thế giới); độ dài cố định */
  poseSnake(sn){
    const T=this.T,R=this.rest,g=sn.gl,pts=sn.wpts;
    if(!pts||!g)return;
    const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1],pts[i][2]-pts[i-1][2]));
    const L=cum[cum.length-1]||1;
    const at=(s,out)=>{
      s=Math.max(0,Math.min(L,s));
      let k=1;while(k<cum.length-1&&cum[k]<s)k++;
      const a=pts[k-1],b=pts[k],t=(s-cum[k-1])/((cum[k]-cum[k-1])||1);
      return out.set(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t);
    };
    const kw=SNAKE_LEN/(R.total+R.hoff+1.5),P=new T.Vector3(),A=new T.Vector3(),B=new T.Vector3(),F=new T.Vector3();
    R.chain.forEach((bi,c)=>{
      const s=(R.hoff+R.sRest[c])*kw;
      at(s,P);at(s-5,A);at(s+5,B);
      F.subVectors(A,B);if(F.lengthSq()<1e-6)F.set(1,0,0);F.normalize();
      g.bones[bi].matrixWorld.copy(R.frameOf(F.clone(),P.clone(),kw).multiply(R.inv[c]).multiply(R.B[c]));
    });
  },
  poseMouse(m,dt,t){
    const g=m.gl;
    g.grp.position.set(m.x,0,m.z);
    g.grp.rotation.y=Math.PI/2-m.th;
    let pitch=0;
    if(m.state==='gnaw')pitch=.32+.14*Math.sin(t*38+g.phase);
    else if(m.state==='sniff')pitch=.1+.1*Math.sin(t*9+g.phase);
    g.grp.rotation.x=lerp(g.grp.rotation.x,pitch,.35);
    if(g.mixer)g.mixer.update(dt*clamp((m.spd||0)/42,0,2.4));
    g.grp.updateMatrixWorld(true);
  },
  size(){
    const host=this.canvas.parentElement,W=host.clientWidth,H=host.clientHeight;
    if(W!==this.W||H!==this.H){
      this.W=W;this.H=H;this.renderer.setSize(W,H,false);
      const k=Math.min(W/1000,H/600);

      this.camera.aspect=W/H;this.camera.updateProjectionMatrix();
    }
  },
  frame(sc,dt){
    if(this.state!=='ready'||!this.renderer)return;
    this.active=sc;
    this.size();
    if(!this.shown){this.canvas.style.display='block';this.shown=true}
    const C=sc.camC;
    this.camera.position.set(C[0],C[1],C[2]);this.camera.up.set(0,1,0);this.camera.lookAt(0,-25,20);this.camera.updateMatrixWorld(true);
    this.scenes.forEach(s=>{
      s.snakes.forEach(sn=>{if(sn.gl)sn.gl.root.visible=(s===sc)&&!sn.dying});
      s.mice.forEach(m=>{if(m.gl)m.gl.root.visible=(s===sc)&&!m.dying});
    });
    const t=performance.now()/1000;
    sc.snakes.forEach(sn=>{if(sn.gl&&!sn.dying)this.poseSnake(sn)});
    sc.mice.forEach(m=>{if(m.gl&&!m.dying)this.poseMouse(m,dt||0,t)});
    this.renderer.render(this.scene,this.camera);
  },
  hide(){if(this.canvas&&this.shown){this.canvas.style.display='none';this.shown=false;this.active=null}},
  snapshotImage(sc){
    if(this.state!=='ready'||this.active!==sc||!this.shown)return '';
    try{
      this.renderer.render(this.scene,this.camera);
      const url=this.canvas.toDataURL('image/png'),k=Math.min(this.W/1000,this.H/600);
      return `<image href="${url}" x="${f1(500-this.W/(2*k))}" y="${f1(300-this.H/(2*k))}" width="${f1(this.W/k)}" height="${f1(this.H/k)}"/>`;
    }catch(e){return ''}
  }
};

    const mi=addItem(80*k-3+(jj-1.5)*2,0,z+jj*3,1,`<ellipse cx="2" cy="2" rx="22" ry="5" fill="#000" opacity=".2"/><path d="${blob(0,-12,20,13,9,k*13+z,.25)}" class="mp0"/><path d="${blob(-7,-15,12,8,8,k*7+z,.2)}" class="mp1"/><path d="${blob(8,-13,11,8,8,k*5+z,.2)}" class="mp2"/>`);mi.mini=true;mi.vis=1;mi.tv=1;minis.push([mi.x,mi.z,k]);miniItems.push(mi);

          if(m.gnaw&&m.gx!=null&&Math.random()<.8){m.faceX=m.gx-m.x;setMouseState(m,'gnaw',1.6+Math.random()*1.4)}
          else pickTarget(m)}break;
        case'gnaw':m.t-=dt;if(m.t<=0)pickTarget(m);break;
      }
      let want=null;
      if(m.vx||m.vz)want=Math.atan2(m.vz,m.vx);
      else if((m.state==='gnaw'||m.state==='sniff')&&m.gx!=null)want=Math.atan2(m.gz-m.z,m.gx-m.x);
      if(want!=null){let dd=want-m.th;while(dd>Math.PI)dd-=2*Math.PI;while(dd<-Math.PI)dd+=2*Math.PI;m.th+=clamp(dd,-9*dt,9*dt)}
    });
    const hunters=live.filter(s=>s.state==='hunt').length;
    let need=pend-hunters;
    live.forEach(s=>{
      if(s.hunting){s.state='rest';s.t=3}
      if(need>0&&s.state!=='hunt'&&s.state!=='rest'&&!s.hunting){
        const free=mAct().filter(m=>!m.hunted);
        if(free.length){
          const c=free.reduce((a,m)=>Math.hypot(m.x-s.x,m.z-s.z)<Math.hypot(a.x-s.x,a.z-s.z)?m:a,free[0]);
          c.hunted=true;s.tgt=c;s.state='hunt';s.t=14;need--;s.path=[];s.planT=0;
        }
      }
      s.cd-=dt;s.ph+=(s.sp>1?2.4+s.sp*.06:.7)*dt;
      let speed=0,tgtLift=0,goal=null;
      switch(s.state){
        case'rest':s.t-=dt;if(s.t<=0&&!s.hunting)snakeWander(s);break;
        case'wander':{
          goal=s.path[0];speed=38;
          if(!goal){if(Math.random()<.4){s.state='rest';s.t=1+Math.random()*2}else snakeWander(s);break}
          if(s.cd<=0){
            const mice=mAct().filter(m=>!m.hunted);
            if(mice.length){
              const c=mice.reduce((a,m)=>Math.hypot(m.x-s.x,m.z-s.z)<Math.hypot(a.x-s.x,a.z-s.z)?m:a,mice[0]);
              if(Math.hypot(c.x-s.x,c.z-s.z)<280&&Math.random()<.5){s.state='watch';s.t=1.3+Math.random()*.7;s.tgt=c;s.path=[]}
            }
            s.cd=3+Math.random()*3;
          }
          break;}
        case'watch':
          tgtLift=1;s.t-=dt;
          if(s.tgt)steer(s,Math.atan2(s.tgt.z-s.z,s.tgt.x-s.x),dt,.9);
          if(s.t<=0){s.state='rest';s.t=.3;s.tgt=null;s.cd=4+Math.random()*3}
          break;
        case'hunt':{
          const m=s.tgt;
          if(!m||m.dying||m.exit){s.state='rest';s.t=.8;s.tgt=null;break}
          s.t-=dt;s.planT-=dt;speed=125;tgtLift=.3;
          if(s.planT<=0||!s.path.length){
            s.planT=1.2;s.row=clamp(m.z,ZH0,ZH1);
            const lj=laneOf(m);
            s.path=lj!=null?routeLane(s,lj,m.z+22):routeTo(s,m.x,m.z+14);
          }
          goal=s.path[0];
          if(Math.hypot(m.x-s.x,m.z-s.z)<28){removeMouse(m);s.tgt=null;s.state='rest';s.t=1.8;s.cd=3;s.path=[];goal=null;speed=0}
          else if(s.t<=0){m.hunted=false;s.tgt=null;s.state='rest';s.t=1;s.path=[];goal=null;speed=0}
          break;}
      }
      /* rắn chỉ bò thẳng dọc luống (trục Z) hoặc ngang vuông góc (trục X) */
      let axis=null;
      if(goal){
        const dx=goal[0]-s.x,dz=goal[1]-s.z;
        if(Math.abs(dx)<3&&Math.abs(dz)<3){s.path.shift();goal=null}
        else{axis=Math.abs(dx)>=Math.abs(dz)?[Math.sign(dx),0]:[0,Math.sign(dz)];s.ax=axis;s.th=Math.atan2(axis[1],axis[0])}
      }
      s.lift=lerp(s.lift,tgtLift,Math.min(1,dt*4));
      let sp=axis?speed:0;
      if(sp>0){
        const nx=s.x+axis[0]*sp*dt,nz=s.z+axis[1]*sp*dt;
        if(blocked(s,nx,nz)||(!inReg(nx,nz)&&inReg(s.x,s.z))){
          sp=0;s.blockT+=dt;
          if(s.blockT>1.5){s.blockT=0;if(s.state==='wander')snakeWander(s);else if(s.state==='hunt')s.planT=0}
        }else s.blockT=0;
      }
      s.sp=lerp(s.sp,sp,Math.min(1,dt*3));
      if(s.sp>.5&&s.ax){
        const mv=s.sp*dt;
        s.x+=s.ax[0]*mv;s.z+=s.ax[1]*mv;
        if(goal){   /* chỉnh nốt độ lệch nhỏ so với trục để đường bò luôn thẳng */
          if(s.ax[0]!==0){const r=goal[1]-s.z;s.z+=Math.sign(r)*Math.min(Math.abs(r),30*dt)}
          else{const r=goal[0]-s.x;s.x+=Math.sign(r)*Math.min(Math.abs(r),30*dt)}
        }
        const l=s.trail[0];
        if(Math.hypot(s.x-l[0],s.z-l[1])>=3.2){s.trail.unshift([s.x,s.z]);if(s.trail.length>90)s.trail.pop()}
        else s.trail[0]=[s.x,s.z];
      }    });
    updateHunter(dt);
  }

  /* =================== VẼ (chiếu phối cảnh) =================== */
  function poly(el,pts,y){
    let d='';
    for(let i=0;i<pts.length;i++){const p=proj(pts[i][0],y||0,pts[i][1]);d+=(i?'L':'M')+f1(p[0])+' '+f1(p[1])}
    el.setAttribute('d',d+'Z');
  }
  function drawSnake(sn){
    const N=22,SP=3.2,L=GLS.snake?SNAKE_LEN+14:150,step=(L/SP)/(N-1),tr=sn.trail;
    const wr=[];
    for(let i=0;i<N;i++){
      const idx=i*step,k=Math.min(Math.floor(idx),tr.length-2),f=idx-k,a=tr[k],b=tr[k+1];
      wr.push([a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f]);
    }
    const wp=wr.map((p,i)=>{let sx=0,sz=0;for(let k=-2;k<=2;k++){const q=wr[Math.max(0,Math.min(N-1,i+k))];sx+=q[0];sz+=q[1]}return[sx/5,sz/5]});   /* bo tròn nhẹ góc vuông */
    const A=2.5*(.25+.75*Math.min(1,sn.sp/30)),pts=[],ws=[],sc=[],wpts=[];
    for(let i=0;i<N;i++){
      const p0=wp[Math.max(0,i-1)],p1=wp[Math.min(N-1,i+1)];
      let tx=p0[0]-p1[0],tz=p0[1]-p1[1];const l=Math.hypot(tx,tz)||1;tx/=l;tz/=l;
      const env=Math.sin(Math.min(1,(i+.5)/6)*Math.PI/2)*(1-.2*i/N),off=A*Math.sin(sn.ph-i*.62)*env;
      const q=i/(N-1),w=6.4*(1-Math.pow(q,1.7)*.88)+.7;
      const lf=sn.lift*16*Math.pow(Math.max(0,1-i/9),2);
      const p=proj(wp[i][0]-tz*off,w*.7+lf,wp[i][1]+tx*off);
      pts.push([p[0],p[1]]);sc.push(p[2]);ws.push(w*p[2]);wpts.push([wp[i][0]-tz*off,w*.7+lf,wp[i][1]+tx*off]);
      if(i===0){sn.depth=p[3];sn.s0=p[2]}
    }
    sn.wpts=wpts;
    const nrm=[];
    for(let i=0;i<N;i++){
      const p0=pts[Math.max(0,i-1)],p1=pts[Math.min(N-1,i+1)];
      let tx=p0[0]-p1[0],ty=p0[1]-p1[1];const l=Math.hypot(tx,ty)||1;tx/=l;ty/=l;
      nrm.push([-ty,tx,tx,ty]);
    }
    let hl='',bk='';const left=[],right=[],bA=[],bB=[];
    for(let i=0;i<N;i++){
      const n=nrm[i],ds=n[1]>=0?1:-1,w=ws[i],p=pts[i];
      left.push(`${f1(p[0]+n[0]*w)} ${f1(p[1]+n[1]*w)}`);right.push(`${f1(p[0]-n[0]*w)} ${f1(p[1]-n[1]*w)}`);
      bA.push(`${f1(p[0]+n[0]*ds*w*.15)} ${f1(p[1]+n[1]*ds*w*.15)}`);bB.push(`${f1(p[0]+n[0]*ds*w*.92)} ${f1(p[1]+n[1]*ds*w*.92)}`);
      hl+=(i?'L':'M')+`${f1(p[0]-n[0]*ds*w*.5)} ${f1(p[1]-n[1]*ds*w*.5)}`;
      if(i>=2&&i<N-3&&i%3===2){
        const seg=step*SP*1.1*sc[i],tx=n[2]*seg,ty=n[3]*seg,bw=w*.78;
        bk+=`M${f1(p[0]+tx)} ${f1(p[1]+ty)}L${f1(p[0]-n[0]*ds*bw*.9)} ${f1(p[1]-n[1]*ds*bw*.9)}L${f1(p[0]-tx)} ${f1(p[1]-ty)}L${f1(p[0]+n[0]*ds*bw*.2)} ${f1(p[1]+n[1]*ds*bw*.2)}Z`;
      }
    }
    const bdd='M'+left.join('L')+'L'+right.reverse().join('L')+'Z';
    sn.bd.setAttribute('d',bdd);if(!sn.gl)sn.sh.setAttribute('d',bdd);
    sn.bl.setAttribute('d','M'+bA.join('L')+'L'+bB.reverse().join('L')+'Z');
    sn.hl.setAttribute('d',hl);sn.bk.setAttribute('d',bk);
    const h=pts[0],h2=pts[2],th=Math.atan2(h[1]-h2[1],h[0]-h2[0]),sg=Math.cos(th)>=0?1:-1;
    sn.hd.setAttribute('transform',`translate(${f1(h[0])} ${f1(h[1])}) rotate(${f1(th*180/Math.PI)}) scale(${f1(sc[0])} ${f1(sc[0]*sg)})`);
    /* bóng đổ lên đất */
    if(sn.gl){
      let d='';wp.forEach((q,i)=>{const p=proj(q[0],0,q[1]);d+=(i?'L':'M')+f1(p[0])+' '+f1(p[1])});
      sn.sh.setAttribute('d',d);sn.sh.setAttribute('fill','none');sn.sh.setAttribute('stroke','#102010');sn.sh.setAttribute('stroke-width',f1(8*sc[0]));sn.sh.setAttribute('opacity','.2');sn.sh.setAttribute('stroke-linecap','round');sn.sh.removeAttribute('transform');
    }else{const sp=proj(sn.x,0,sn.z);sn.sh.setAttribute('transform',`translate(${f1(2*sp[2])} ${f1(5*sp[2])})`)}
  }
  function render(){
    setupCam();
    self.camC=C.slice();
    const yh=300-FOCAL*Math.tan(cam.pitch);
    lawn.setAttribute('y',f1(yh));
    const off=((cam.yaw*FOCAL)%W+W)%W;
    pan.setAttribute('transform',`translate(${f1(off)} ${f1(yh)})`);
    /* mặt trên + luống */
    quads.forEach(q=>poly(q.p,q.pts,0));
    /* các mặt cắt của khối đất */
    faces.forEach(f=>{
      const vis=(C[0]-f.c[0])*f.n[0]+(C[1]-f.c[1])*f.n[1]+(C[2]-f.c[2])*f.n[2]>0;
      f.g.style.display=vis?'':'none';
      if(!vis)return;
      const p0=proj(f.o[0],0,f.o[2]),x0=p0[0],y0=p0[1];
      const p1=proj(f.o[0]+f.ux[0]*f.W,0,f.o[2]+f.ux[2]*f.W),x1=p1[0],y1=p1[1];
      const p2=proj(f.o[0],-FH,f.o[2]);
      f.g.setAttribute('transform',`matrix(${f1((x1-x0)/f.W)} ${f1((y1-y0)/f.W)} ${f1((p2[0]-x0)/FH)} ${f1((p2[1]-y0)/FH)} ${f1(x0)} ${f1(y0)})`);
    });
    /* vật thể */
    items.forEach(it=>{
      if(it.fence){
        let rl='',ps='',s0=0,n=0;
        it.pts.forEach((p,i)=>{
          const b=proj(p[0],0,p[1]),t=proj(p[0],36,p[1]),r1=proj(p[0],16,p[1]),r2=proj(p[0],28,p[1]);
          ps+=`M${f1(b[0])} ${f1(b[1])}L${f1(t[0])} ${f1(t[1])}`;s0+=b[2];n++;
          rl+=(i?'L':'M')+f1(r1[0])+' '+f1(r1[1]);
          it['r2'+i]=r2;
        });
        let rl2='';it.pts.forEach((p,i)=>{const r2=proj(p[0],28,p[1]);rl2+=(i?'L':'M')+f1(r2[0])+' '+f1(r2[1])});
        const s=s0/n;it.rail.setAttribute('d',rl+rl2);it.rail.setAttribute('stroke-width',f1(3.5*s));
        it.post.setAttribute('d',ps);it.post.setAttribute('stroke-width',f1(6*s));
        it.depth=proj(it.mid[0],0,it.mid[1])[3];
        return;
      }
      if(it.isSnake){drawSnake(it);return}
      if(it.isHunter){
        if(hu.state==='off')return;
        const p=proj(it.x,0,it.z),s=p[2];
        it.depth=p[3];
        const q=proj(it.x+it.vx*6,0,it.z+it.vz*6),ux=q[0]-p[0];
        if(it.moving&&Math.abs(ux)>.05)it.dir=ux>0?1:-1;else if(it.face){const pf2=proj(it.x+it.face*30,0,it.z);it.dir=pf2[0]>p[0]?1:-1}
        const sw=it.moving?Math.sin(it.ph)*30:0;
        hu.legA.setAttribute('transform',`rotate(${f1(sw)})`);hu.legB.setAttribute('transform',`rotate(${f1(-sw)})`);
        hu.armB.setAttribute('transform',`rotate(${f1(it.moving?-sw*.8:4)})`);
        hu.armA.setAttribute('transform',`rotate(${f1(it.moving?sw*.8:4-it.reach*84)})`);
        hu.body.setAttribute('transform',`translate(0 ${f1(it.moving?-Math.abs(Math.sin(it.ph))*1.6:it.lean*4)}) rotate(${f1(it.lean*20)})`);
        hu.g.setAttribute('transform',`translate(${f1(p[0])} ${f1(p[1])}) scale(${f1(it.dir*s*.95)} ${f1(s*.95)})`);
        return;
      }
      if(it.mo){
        const p=proj(it.x,0,it.z),s=p[2];it.depth=p[3];
        let ux=0,uy=0;
        if(it.vx||it.vz){const q=proj(it.x+it.vx*8,0,it.z+it.vz*8);ux=q[0]-p[0];uy=q[1]-p[1];const l=Math.hypot(ux,uy)||1;if(Math.abs(ux)>.05)it.dir=ux>0?1:-1;it.fx=lerp(it.fx,.5+.5*Math.abs(ux/l),.3)}
        else if(it.state==='gnaw'||it.state==='sniff'){if(it.faceX){const q=proj(it.x+it.faceX,0,it.z);it.dir=q[0]>p[0]?1:-1}it.fx=lerp(it.fx,1,.2)}
        else it.fx=lerp(it.fx,1,.2);
        if(it.shd){it.shd.setAttribute('cx',f1(p[0]));it.shd.setAttribute('cy',f1(p[1]));it.shd.setAttribute('rx',f1(24*s));it.shd.setAttribute('ry',f1(8*s))}
        const k=.78*s;
        it.g.setAttribute('transform',`translate(${f1(p[0])} ${f1(p[1])}) scale(${f1(it.dir*k*it.fx)} ${f1(k)})`);
        return;
      }
      const p=proj(it.x,it.y,it.z);
      it.depth=p[3];
      if(it.mini)it.vis+=clamp(it.tv-it.vis,-.8*(self.dtLast||.016),.5*(self.dtLast||.016));
      const hide=p[3]<90||(it.mini&&it.vis<.03);
      if(hide!==it.hidden){it.hidden=hide;it.g.style.display=hide?'none':''}
      if(!hide)it.g.setAttribute('transform',`translate(${f1(p[0])} ${f1(p[1])}) scale(${f1(p[2]*it.k)} ${f1(p[2]*it.k*(it.mini?1-.32*(self.wilt||0):1))})`);
    });
    const order=items.slice().sort((a,b)=>b.depth-a.depth);
    for(let i=0;i<order.length;i++){const g=order[i].g;if(wld.children[i]!==g)wld.insertBefore(g,wld.children[i]||null)}
    GLS.frame(self,self.dtLast);
  }
  render();
  self.clear=function(){self.snakes.forEach(s=>s.g.remove());self.mice.forEach(m=>m.g.remove());self.snakes=[];self.mice=[]};
  return self;
}

  for(let i=0;i<8;i++){const x=r()*1000,y=420+r()*140;w2+=`<ellipse cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" rx="${(40+r()*60).toFixed(0)}" ry="${(7+r()*10).toFixed(0)}" fill="${r()>.5?'#a68a58':'#4f7f41'}" opacity=".3"/>`}

  const FL=[];const fc=['#f4a6c6','#fff3a0','#ffffff','#c9a9ec','#ffb066'];

  w2+=`<g class="ents-b"></g>`;

  w3+=`</g>`;
  svg.innerHTML=w1+w2+w3;
  const trEls={};$$(svg,'.ftree').forEach(g=>{if(g.classList.contains('sap'))return;trEls[g.dataset.i]={g,trk:$(g,'.trk'),cnp:$(g,'.cnp'),stp:$(g,'.stp'),v:1}});
  const saps=$$(svg,'.sap').map((g,i)=>({g,trk:$(g,'.trk'),cnp:$(g,'.cnp'),stp:$(g,'.stp'),v:1,thr:[.05,.1,.15][i],base:SAP[i]}));

  self.setH=function(h){self.h=h};
  function applyTree(t,v,sc){
    t.v=v;

    if(h<.08)self.growth=Math.min(1,self.growth+.012*dt);
    saps.forEach(s=>{

      const v=s.v+clamp(target-s.v,-rate*dt,rate*dt);
      applyTree(s,v,.55+.45*self.growth);
    });
    let sh=0;
    bushes.forEach(b=>{const alive=h<b.thr;b.v+=clamp((alive?1:0)-b.v,-(alive?.1:.7)*dt,(alive?.1:.7)*dt);b.g.style.opacity=b.v.toFixed(2);b.g.setAttribute('transform',`translate(0 ${((1-b.v)*10).toFixed(1)})`);sh+=b.v});
    flw.forEach(f=>{const alive=h<f.thr;f.v+=clamp((alive?1:0)-f.v,-(alive?.15:.8)*dt,(alive?.15:.8)*dt);f.g.setAttribute('transform',`translate(${f.x.toFixed(0)} ${f.y.toFixed(0)}) scale(${f.v.toFixed(2)})`);f.g.style.opacity=f.v.toFixed(2)});
    bare.setAttribute('opacity',(h*.38).toFixed(2));
    const fq=Math.round(h*25);
    if(fq!==self.fq){self.fq=fq;Object.values(trEls).forEach(T0=>{T0.cnp.style.filter=h>.02?`saturate(${(1-.5*h).toFixed(2)}) sepia(${(.4*h).toFixed(2)})`:''})}
    let an=0;

    ents.forEach(([k,a])=>{
      if(!a.away&&h>=a.leave)a.away=true;
      else if(a.away&&h<a.leave-.12)a.away=false;
      a.ox=lerp(a.ox,a.away?a.dx:0,Math.min(1,dt*(a.away?.9:.5)));
      a.oy=lerp(a.oy,a.away?(k==='rb'||k==='sq'?0:-260):0,Math.min(1,dt*.9));
      a.o=lerp(a.o,a.away?0:1,Math.min(1,dt*(a.away?.8:.6)));
      if(!a.away)an+=a.o;
      let x=a.x+a.ox,y=a.y+a.oy,rot=0;
      if(k==='bf1'){x=285+Math.sin(t*.9)*60+a.ox;y=492+Math.cos(t*1.7)*26+a.oy}
      else if(k==='bf2'){x=700+Math.sin(t*.7+2)*70+a.ox;y=480+Math.cos(t*1.4)*30+a.oy}
      else if(k==='bee'){x=540+Math.sin(t*1.5)*50+a.ox;y=500+Math.sin(t*2.6)*22+a.oy}
      else if(k==='bird2'){x=(120+(t*38)%880)+a.ox;y=150+Math.sin(t*1.1)*18+a.oy}
      else if(k==='rb'){const hop=a.away?Math.abs(Math.sin(t*7))*14:0;y-=hop}
      if(a.o>.02){a.g.style.display='';a.g.style.opacity=a.o.toFixed(2);
        const fx=(k==='bf1'||k==='bf2'||k==='bee')?(Math.cos(t*.9)>=0?1:-1):a.flip;
        a.g.setAttribute('transform',`translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${(a.sc*fx).toFixed(2)} ${a.sc})`)}
      else a.g.style.display='none';
    });

  };

  };

}

function toast(msg){

function snap(svg){

  c.removeAttribute('id');c.removeAttribute('data-r');c.setAttribute('class','m3-scene on');c.style.removeProperty('--px');c.style.removeProperty('--py');
  const gl=svg.__scene?GLS.snapshotImage(svg.__scene):'';
  if(gl)c.insertAdjacentHTML('beforeend',gl);

}

/* =====================================================================
   SỰ KIỆN
   ===================================================================== */
function bindEvents(){
  const root=S.root,view=R('view');
  root.addEventListener('click',e=>{
    const t=e.target;
    const b=t.closest('button');
    if(!b){zoneClick(e);return}
    const r=b.dataset.r;
    if(b.dataset.step!=null){gotoStep(+b.dataset.step);return}
    if(b.dataset.tab!=null){selectTab(+b.dataset.tab);return}
    switch(r){
      case'fs':toggleFs();break;
      case'ov':S.tpx=0;S.tpy=0;S.auto=false;S.cam.tyaw=0;S.cam.tpitch=.36;S.cam.tdist=640;R('auto').setAttribute('aria-pressed','false');break;
      case'auto':S.auto=!S.auto;S.autoT=0;b.setAttribute('aria-pressed',S.auto?'true':'false');if(!S.auto){S.tpx=0;S.tpy=0}break;
      case'narr':toggleNarration();break;
      case'pp':S.paused=!S.paused;refreshPause();break;
      case'prev':gotoStep(S.step-1);break;
      case'next':gotoStep(S.step+1);break;
      case'run':runSim();break;
      case'reset':resetAll9();break;
      case'cmp':openCmp();break;
      case'kn9':openKn(0);break;
      case'kn10':openKn(1);break;
      case'knclose':closeKn();break;
      case'knlisten':Aud.play(KN[S.knStep].key,{force:true});break;
      case'sw':toggleSwitch();break;
      case'rst10':resetScenario10();break;
      case'explore':introStart();break;
      case'cmpclose':closeCmp();break;
    }
    const a=b.dataset.act;
    if(a)practiceAction(a,b);
    const o=b.dataset.opt;
    if(o!=null)pickOpt(+o);
  });
  R('slider').addEventListener('input',e=>onSlider(+e.target.value));
  root.addEventListener('change',e=>{if(e.target.dataset.r==='cmpa'||e.target.dataset.r==='cmpb')renderCmp()});
  /* kéo để đổi góc nhìn (parallax nhẹ) */
  let d=null;
  view.addEventListener('pointerdown',e=>{
    if(e.target.closest('button,input,select,.m3-ov,.m3-practice,.m3-tabs'))return;
    d={x:e.clientX,y:e.clientY,px:S.tpx,py:S.tpy,cy:S.cam.tyaw,cp:S.cam.tpitch};view.classList.add('dragging');
    try{view.setPointerCapture(e.pointerId)}catch(_){}
  });
  view.addEventListener('pointermove',e=>{
    if(!d)return;
    S.auto=false;R('auto').setAttribute('aria-pressed','false');
    if(is3D()){S.cam.tyaw=d.cy-(e.clientX-d.x)*.006;S.cam.tpitch=clamp(d.cp+(e.clientY-d.y)*.004,.08,1.1)}
    else{S.tpx=clamp(d.px+(e.clientX-d.x)/320,-1,1);S.tpy=clamp(d.py+(e.clientY-d.y)/420,-1,1)}
  });
  const end=()=>{d=null;view.classList.remove('dragging')};
  view.addEventListener('wheel',e=>{if(!is3D()||e.target.closest('.m3-ov,.m3-practice'))return;e.preventDefault();S.cam.tdist=clamp(S.cam.tdist*(1+e.deltaY*.0012),420,1300)},{passive:false});
  view.addEventListener('pointerup',end);view.addEventListener('pointercancel',end);
  /* kéo thả Step 11 */
  R('prac').addEventListener('pointerdown',dndDown);
}
const is3D=()=>S.step===0||(S.step===1&&S10.cur===0);
function toggleFs(){
  const el=S.root;
  if(!document.fullscreenElement)(el.requestFullscreen||document.documentElement.requestFullscreen).call(el).catch(()=>{});
  else document.exitFullscreen&&document.exitFullscreen().catch(()=>{});
}
function toggleNarration(){
  S.narrationEnabled=!S.narrationEnabled;refreshNarr();
  if(!S.narrationEnabled){Aud.stop();T.clearAll();return}
  const k=S.lastKey||['S09_Voice','S10_Voice','S11_Voice'][S.step];
  Aud.play(k);
}

/* =====================================================================
   ĐIỀU HƯỚNG STEP
   ===================================================================== */
function gotoStep(i,opt){
  i=clamp(i,0,2);
  if(i===S.step&&!(opt&&opt.force))return;
  Aud.stop();T.clearAll();closeKn(true);closeCmp();
  if(S.step===0&&S9.running)abortRun9();
  S.paused=false;S.step=i;S.narrationEnabled=true;S.lastKey=null;refreshNarr();
  const root=S.root;
  $$(root,'.m3-pane').forEach(p=>p.classList.toggle('on',+p.dataset.pane===i));
  $$(root,'.m3-step').forEach((b,k)=>b.setAttribute('aria-pressed',k===i?'true':'false'));
  R('prev').disabled=i===0;R('next').disabled=i===2;
  R('tabs').classList.toggle('on',i===1);
  R('clock').classList.toggle('on',i<2);
  R('prac').classList.toggle('on',i===2);
  R('bst').classList.remove('on');
  showScene();refreshPause();
  if(i===0){sync9();Aud.play('S09_Voice')}
  else if(i===1){loadScenario10(S10.cur);Aud.play('S10_Voice')}
  else{
    renderPractice();
    if(S11.phase==='q1')Aud.play('S11_Voice',{onEnd:()=>{if(S.step===2&&S11.phase==='q1')Aud.play('S11_Q01')}});

function harmOf(sc){return sc.safe?!sc.on:sc.on}
function sceneEl10(sc){return R(sc.key==='field'?'sc10a':sc.key==='pond'?'sc10b':'sc10c')}
function weekOf(sc){return Math.floor(sc.weeks)}
function sync10(full){
  const sc=SC10[S10.cur];
  const sw=R('sw');
  sw.setAttribute('aria-checked',sc.on?'true':'false');sw.classList.toggle('safe',sc.safe);
  R('clk').textContent='Tuần '+weekOf(sc);R('clkb').style.width=(sc.h*100)+'%';
  const mt=R('mt10');
  let rows;
  if(sc.key==='field'){
    const ps=potatoStatus(sc.P),ms=miceStatus(sc.M),sn=Math.round(sc.S);
    rows=[['snake',sc.S/5,sn+' con',sc.S<4.4?'warn':''],['mouse',sc.M/10,ms.t,ms.c],['potato',sc.P,ps.t,ps.c]];
  }else if(sc.key==='pond'){
    const f=pond.st;
    rows=[['fish',f.fish/10,f.fish>=9?'Đông đúc':f.fish>=5?'Thưa dần':'Rất thưa',f.fish>=9?'':f.fish>=5?'warn':'bad'],
      ['shrimp',f.small/6,f.small>=5?'Nhiều':f.small>=3?'Ít dần':'Rất ít',f.small>=5?'':f.small>=3?'warn':'bad'],
      ['weed',f.plant,f.plant>=.9?'Xanh tốt':'Kém sinh động',f.plant>=.9?'':'warn'],
      ['bird',f.bird==='dip'?1:f.bird==='search'?.45:.1,f.bird==='dip'?'Kiếm ăn tốt':f.bird==='search'?'Khó tìm mồi':'Đã rời đi',f.bird==='dip'?'':f.bird==='search'?'warn':'bad']];
  }else{
    const s=forest.stats;
    const t=(v,a,b,c)=>v>.85?a:v>.45?b:c;
    rows=[['tree',s.trees,t(s.trees,'Xanh tốt','Thưa dần','Còn rất ít'),s.trees>.85?'':s.trees>.45?'warn':'bad'],
      ['home',s.shelter,t(s.shelter,'Đầy đủ','Thu hẹp','Gần như mất'),s.shelter>.85?'':s.shelter>.45?'warn':'bad'],
      ['animal',s.animals,t(s.animals,'Đông đủ','Rời đi dần','Rất ít'),s.animals>.85?'':s.animals>.45?'warn':'bad']];
  }
  rows.forEach(r=>setRow(mt,r[0],r[1],r[2],r[3]));
  /* thông tin & trước/sau */
  const inf=R('inf');
  let itx=null,good=false;
  if(sc.key==='forest'){
    if(harmOf(sc)&&sc.h>=.5)itx=sc.infoHarm;
    else if(!harmOf(sc)&&sc.hadHarm){itx=sc.info;good=true}
  }else if(sc.explored&&(harmOf(sc)||sc.h>.2)){itx=sc.info;good=!harmOf(sc)}
  inf.hidden=itx==null;
  if(itx!=null){inf.textContent=itx;inf.className='m3-info'+(good?' good':'')}
  const fig=(el,html,ph)=>{$$(el,'.m3-frozen,.empty').forEach(n=>n.remove());el.insertAdjacentHTML('beforeend',html?`<div class="m3-frozen" style="position:absolute;inset:0">${html}</div>`:`<div class="empty">${ph}</div>`)};
  if(full||S.t10Dirty!==S10.cur+':'+(sc.before?1:0)+(sc.after?1:0)){
    fig(R('bf'),sc.before,sc.safe?'Tắt bảo vệ rừng để lưu lại trạng thái trước':'Bật công tắc để lưu lại trạng thái trước');
    fig(R('af'),sc.after,'Quan sát thêm để xem trạng thái sau');
    S.t10Dirty=S10.cur+':'+(sc.before?1:0)+(sc.after?1:0);
  }
  R('chips').innerHTML=SC10.map(s=>`<span class="m3-chip ${s.explored?'done':''}">${CHECK_SVG.replace('#fff','#1d6b46')}${s.tab}</span>`).join('');
  $$(S.root,'.m3-tab').forEach((b,k)=>b.classList.toggle('done',SC10[k].explored));
  R('kn10').hidden=!SC10.every(s=>s.explored);
}
function tick10(d){
  const sc=SC10[S10.cur];
  const harm=harmOf(sc);
  const target=harm?1:0;
  if(d>0){
    const rate=harm?sc.up:sc.down;
    if(sc.key!=='field')sc.h+=clamp(target-sc.h,-rate*d,rate*d);
    sc.weeks+=d/1.2;
    if(sc.key==='field'){
      field10.setHunting(sc.on);
      const act=field10.activeSnakes();
      if(sc.on)sc.S=act;
      else{sc.S=Math.min(5,Math.max(sc.S,act)+.13*d);field10.setSnakeCount(Math.floor(sc.S+.001))}
      sc.h=clamp((5-act)/4,0,1);
      sc.M=clamp(sc.M+(9-.8*sc.S-sc.M)*.22*d,.5,10);
      if(sc.M>5)sc.P=clamp(sc.P-.009*(sc.M-5)*d,0,1);
      else if(sc.P<.85)sc.P=Math.min(.85,sc.P+.02*(5-sc.M)*d);
      field10.setMouseCount(Math.round(sc.M));field10.setHealth(sc.P);
    }else if(sc.key==='pond'){
      sc.e+=clamp((harm?1:0)-sc.e,-1.5*d,1.5*d);
      const fish=Math.round(10-8*sc.h),small=Math.round(6-5*sc.h);
      const st={fish,small,plant:Math.round((1-.35*sc.h)*50)/50,bird:fish>=6?'dip':fish>=3?'search':'away',elec:Math.round(sc.e*50)/50,desat:Math.round(sc.h*50)/50};
      const key=JSON.stringify(st);
      if(key!==sc.key2){sc.key2=key;pond.set(st)}
    }else{
      forest.setH(sc.h);
    }
    /* kết quả xuất hiện khi tác động đã thể hiện rõ */
    if(harm&&sc.h>=.895&&!sc.fired){      /* suy giảm đủ rõ (rừng: khoảng Tuần 30) */
      sc.fired=true;sc.explored=true;sc.after=snap(sceneEl10(sc));
      sync10(true);
      Aud.play(sc.voice);
    }
    if(!harm&&sc.h<.25)sc.fired=false;
    if(harm&&sc.h>=.3)sc.hadHarm=true;
  }
  if(sc.key==='field')field10.update(d);else if(sc.key==='pond')pond.update(d);else forest.update(d);
  S10.acc+=d;
  if(S10.acc>.2){S10.acc=0;sync10(false)}
}

  fish:()=>`<svg viewBox="0 0 120 72"><defs><linearGradient id="${P}ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#98e4e8"/><stop offset="1" stop-color="#1b6c84"/></linearGradient></defs><rect width="120" height="72" fill="url(#${P}ag)"/><path d="M0 12Q15 8 30 12T60 12T90 12T120 12" stroke="#fff" stroke-width="1.4" fill="none" opacity=".6"/><path d="M0 66Q30 62 60 66T120 64L120 72L0 72Z" fill="#8d7552"/><g transform="translate(46 44)">${fishMarkup(40,17,'#e9a23f','#f7d594','#e2762a',0)}</g><g transform="translate(88 30) scale(-1 1)">${fishMarkup(26,11,'#cfdde6','#f4f9fb','#a9c3d1',0)}</g><path d="M26 64q3-14 4-3M38 64q-2-10 3-6" stroke="#3f9a58" stroke-width="2.4" fill="none"/><g transform="translate(20 22)"><path d="M6-16L-7 4L0 4L-4 16L10-5L3-5Z" fill="#ffd21f" stroke="#a8791a" stroke-width="1.2" stroke-linejoin="round"/></g></svg>`,
  habitat:()=>`<svg viewBox="0 0 120 72"><rect width="120" height="72" fill="#d3ebd6"/><path d="M0 54C30 48 80 50 120 52L120 72L0 72Z" fill="#7fb35e"/><path d="M-4 54C14 52 34 52 48 54" stroke="#a8814a" stroke-width="3" fill="none" stroke-linecap="round" opacity=".0"/><rect x="36" y="26" width="9" height="32" rx="2" fill="#7a5638"/><path d="${blob(40,20,28,20,12,8,.22)}" fill="#3f8d47"/><path d="${blob(32,24,15,11,9,9,.2)}" fill="#58a652"/><path d="${blob(48,15,14,10,9,10,.2)}" fill="#7fc06a"/><ellipse cx="41" cy="38" rx="9" ry="5.5" fill="#7a5a2c"/><ellipse cx="41" cy="36" rx="7" ry="3.5" fill="#a07a3c"/><ellipse cx="38" cy="33" rx="4" ry="3" fill="#f2c94c"/><circle cx="40" cy="32" r="3.4" fill="#fbfbf3"/><path d="M42 32L47 33L42 34Z" fill="#e7a23a"/><circle cx="40.8" cy="31.4" r=".9" fill="#111"/><g transform="translate(84 60)"><ellipse cx="0" cy="-8" rx="13" ry="9" fill="#cdb79b"/><circle cx="11" cy="-14" r="7" fill="#cdb79b"/><path d="M8-19C5-30 8-34 11-32C13-28 12-22 12-19ZM13-19C12-29 15-33 18-30C19-27 17-22 16-18Z" fill="#cdb79b"/><circle cx="14" cy="-15" r="1.4" fill="#222"/><circle cx="-12" cy="-10" r="4" fill="#fbfbf8"/></g><g stroke="#a8814a" stroke-width="2.4" stroke-linecap="round"><path d="M70 62L70 52M82 62L82 52M96 62L96 52M108 62L108 52M68 56L110 56"/></g></svg>`
};
function renderTasks11(){
  const t=R('tasks11');if(!t)return;
  const chip=(ok,cur,l)=>`<div class="m3-row"><span class="ic" style="${ok?'background:#dff3e6':cur?'background:#e0eef0':''}">${ok?CHECK_SVG.replace('#fff','#1d6b46'):'<b style="font-size:12px;color:var(--brand-dark)">'+(cur?'▶':'•')+'</b>'}</span><span class="nm" style="min-width:0;flex:1">${l}</span><span class="st">${ok?'Xong':cur?'Đang làm':''}</span></div>`;
  t.innerHTML=chip(S11.q1ok,S11.phase==='q1','Nhiệm vụ 1: Phân loại hành động')+chip(S11.q2ok,S11.phase==='q2','Nhiệm vụ 2: Xử lí tình huống')+chip(S11.phase==='summary',false,'Em cần nhớ');
  const tips={q1:'Kéo thả thẻ vào ô NÊN LÀM / KHÔNG NÊN LÀM, hoặc chạm vào thẻ rồi chạm vào ô cần đặt.',q2:'Đọc kĩ tình huống và chọn cách ứng xử phù hợp nhất. Em có thể chọn lại nếu chưa đúng.',summary:'Em đã hoàn thành hai nhiệm vụ! Hãy ghi nhớ ba ý chính.'};
  R('tip11').textContent=tips[S11.phase];
}
function dotsHtml(){
  const cur=S11.phase;
  const d=(n,k,done,dis)=>`<button class="m3-qdot ${cur===k?'cur':''} ${done&&cur!==k?'done':''}" type="button" data-act="goto" data-to="${k}" ${dis?'disabled':''}>${done&&cur!==k?CHECK_SVG:n}</button>`;
  return `<div class="m3-qdots">${d(1,'q1',S11.q1ok,false)}${d(2,'q2',S11.q2ok,false)}${d('★','summary',false,!S11.q2ok)}</div>`;
}
function renderPractice(){
  const pr=R('prac');
  renderTasks11();
  if(S11.phase==='q1'){
    const placed=Object.values(S11.loc).filter(z=>z!=='tray').length;
    const card=id=>{
      const c=CARDS[id],mk=S11.marks[id];
      return `<div class="m3-card11 ${S11.sel===id?'sel':''} ${mk||''}" data-id="${id}"><div class="art">${ART[c.art]()}</div><div class="cap">${c.t}</div><span class="mk">${mk==='ok'?CHECK_SVG:mk==='no'?CROSS_SVG:''}</span></div>`;
    };
    const inZone=z=>CARD_ORDER.filter(id=>S11.loc[id]===z).map(card).join('');
    const correct=S11.q1ok;
    pr.innerHTML=`<div class="m3-pcard"><div class="m3-qhead">${dotsHtml()}<div><h3 class="m3-qtitle">Việc nào nên làm để giữ cân bằng chuỗi thức ăn?</h3><p class="m3-qsub">Kéo thả thẻ vào đúng khu vực, hoặc chạm vào thẻ rồi chạm vào khu vực.</p></div></div>
    <div class="m3-board"><div class="m3-tray" data-zone="tray">${inZone('tray')}</div>
    <div class="m3-zones"><div class="m3-zone good" data-zone="good"><h4>NÊN LÀM</h4><div class="slot">${inZone('good')}</div></div><div class="m3-zone bad" data-zone="bad"><h4>KHÔNG NÊN LÀM</h4><div class="slot">${inZone('bad')}</div></div></div></div>
    <div class="m3-hint ${S11.hintOk?'':''}" ${S11.hint?'':'hidden'} style="${S11.hintOk?'background:#e9f8ef;color:#1b6b43;border-color:#b9e2c9':''}">${S11.hint}</div>
    <div class="m3-acts"><button class="m3-btn" type="button" data-act="check" ${placed<4?'disabled':''}>Kiểm tra</button><button class="m3-btn gold" type="button" data-act="toq2" ${correct?'':'hidden'}>Sang nhiệm vụ 2 ▶</button></div></div>`;
  }else if(S11.phase==='q2'){
    pr.innerHTML=`<div class="m3-pcard"><div class="m3-qhead">${dotsHtml()}<div><h3 class="m3-qtitle">Xử lí tình huống</h3><p class="m3-qsub">Chọn cách làm phù hợp nhất.</p></div></div>
    <div class="m3-situation">Trên một cánh đồng, người dân săn bắt rắn quá nhiều. Sau một thời gian, chuột xuất hiện ngày càng nhiều và phá hại cây trồng. Theo em, việc làm nào giúp góp phần giữ cân bằng chuỗi thức ăn?</div>
    <div class="m3-opts">${Q2_OPTS.map((o,i)=>`<button class="m3-opt ${S11.rightOpt===i?'right':''} ${S11.wrongOpt[i]?'wrong':''}" type="button" data-opt="${i}"><b>${'ABCD'[i]}</b><span>${o}</span></button>`).join('')}</div>
    <div class="m3-fb ${S11.fb?S11.fb.c:''}" ${S11.fb?'':'hidden'}>${S11.fb?S11.fb.t:''}</div>
    <div class="m3-acts"><button class="m3-btn gold" type="button" data-act="tosum" ${S11.q2ok?'':'hidden'}>Xem tổng kết ▶</button></div></div>`;
  }else{
    pr.innerHTML=`<div class="m3-pcard"><div class="m3-qhead">${dotsHtml()}<div><h3 class="m3-qtitle">Tổng kết</h3></div></div>
    <div class="m3-sum"><div><h2>EM CẦN NHỚ</h2><ul><li><i>1</i><span>Các sinh vật trong chuỗi thức ăn có mối quan hệ phụ thuộc lẫn nhau.</span></li><li><i>2</i><span>Khi số lượng một loài thay đổi quá nhiều, các loài khác cũng có thể bị ảnh hưởng và làm mất cân bằng chuỗi thức ăn.</span></li><li><i>3</i><span>Con người cần bảo vệ thực vật, động vật và môi trường sống để góp phần duy trì cân bằng tự nhiên.</span></li></ul>
    <div class="m3-msg">Bảo vệ thiên nhiên là góp phần giữ cân bằng chuỗi thức ăn.</div></div>
    <div class="m3-sumart">${sumArt()}</div></div>
    <div class="m3-acts"><button class="m3-btn alt" type="button" data-act="redo">Làm lại</button></div></div>`;
  }
}
function sumArt(){
  const plant=potatoPlant(0,92,168,.95,321,true).replace(/class="plant"/,'class="plant" style="--lf:#4ea044;--lf2:#3b8738"');
  return `<svg viewBox="0 0 250 200" preserveAspectRatio="xMidYMid slice"><rect width="250" height="200" fill="${u('sky')}"/><circle cx="214" cy="30" r="14" fill="#fff6b5"/>
  <path d="M-10 112C40 90 90 104 140 96S220 92 260 100L260 210L-10 210Z" fill="#9ccb7a"/><path d="M-10 150C60 138 150 146 260 140L260 210L-10 210Z" fill="#b99565"/><path d="M-10 168C60 162 160 168 260 160L260 210L-10 210Z" fill="#8a5f3a"/>
  <ellipse cx="62" cy="186" rx="9" ry="6" fill="#d2a266"/><ellipse cx="98" cy="190" rx="10" ry="6" fill="#d2a266" transform="rotate(-10 98 190)"/><ellipse cx="118" cy="184" rx="8" ry="5" fill="#d2a266"/>
  ${plant}<g transform="translate(176 166) scale(.9)">${mouseMarkup().replace('class="mo run"','class="mo"')}</g>
  <path d="M20 150C40 134 60 160 84 148S120 136 140 148" fill="none" stroke="#6b6a32" stroke-width="9" stroke-linecap="round"/><path d="M20 152C40 137 60 162 84 151S120 139 140 150" fill="none" stroke="#b9b073" stroke-width="3" stroke-linecap="round" opacity=".8"/><path d="M26 143l7-3 3 7-6 4z" fill="#6c6a31" transform="translate(-14 4) scale(.7)"/><circle cx="144" cy="148" r="1.4" fill="#111"/></svg>`;
}
function practiceAction(a,b){
  if(a==='goto'){
    const to=b.dataset.to;if(to===S11.phase)return;
    if(to==='summary'&&!S11.q2ok)return;
    enter11(to);return;
  }
  if(a==='check')checkQ1();
  else if(a==='toq2')enter11('q2');
  else if(a==='tosum')enter11('summary');
  else if(a==='redo'){
    Aud.stop();T.clearAll();
    Object.assign(S11,{phase:'q1',loc:{0:'tray',1:'tray',2:'tray',3:'tray'},marks:{},q1ok:false,q2ok:false,sel:null,hint:'',hintOk:false,fb:null,wrongOpt:{},rightOpt:null});
    renderPractice();
    Aud.play('S11_Q01');
  }else if(a==='finish'){
    toast('Chúc mừng em đã hoàn thành Bài 30!');
    S.root.dispatchEvent(new CustomEvent(P+'complete',{bubbles:true,detail:{module:'canBangChuoiThucAn'}}));
  }
}
function enter11(ph){
  Aud.stop();T.clearAll();
  S11.phase=ph;S11.sel=null;renderPractice();
  if(ph==='q1')Aud.play('S11_Q01');
  else if(ph==='q2')Aud.play('S11_Q02');
  else{S.root.dispatchEvent(new CustomEvent(P+'complete',{bubbles:true,detail:{module:'canBangChuoiThucAn'}}));Aud.play('S11_KetLuan')}
}
function checkQ1(){
  let allOk=true;S11.marks={};
  CARDS.forEach(c=>{const ok=S11.loc[c.id]===c.ans;S11.marks[c.id]=ok?'ok':'no';if(!ok)allOk=false});
  S11.q1ok=allOk;S11.sel=null;
  if(allOk){S11.hint='Chính xác! Trồng cây và bảo vệ nơi sống giúp giữ cân bằng, còn săn bắt quá mức hay đánh bắt bằng điện làm giảm sinh vật.';S11.hintOk=true;beep(true)}
  else{S11.hint='Có thẻ chưa đúng. Hãy nghĩ xem việc làm đó giúp hay làm hại sinh vật và nơi sống của chúng. Em có thể kéo thẻ sang ô khác rồi kiểm tra lại.';S11.hintOk=false;beep(false)}
  renderPractice();
}
function pickOpt(i){
  if(S.step!==2||S11.phase!=='q2'||S11.q2ok)return;
  if(i===1){
    S11.q2ok=true;S11.rightOpt=1;S11.wrongOpt={};
    S11.fb={c:'ok',t:'Chính xác! Bảo vệ các sinh vật và môi trường sống giúp hạn chế nguy cơ mất cân bằng chuỗi thức ăn.'};
    beep(true);renderPractice();
    T.set(()=>{if(S.step===2&&S11.phase==='q2')enter11('summary')},2800);
  }else{
    S11.wrongOpt[i]=true;
    S11.fb={c:'no',t:'Hãy nghĩ đến mối quan hệ giữa rắn, chuột và cây trồng.'};
    beep(false);renderPractice();
  }
}
/* ---- kéo thả ---- */
let dnd=null;
function placeCard(id,zone){
  if(S11.loc[id]===zone)return;
  S11.loc[id]=zone;delete S11.marks[id];S11.q1ok=false;S11.hint='';S11.sel=null;
  renderPractice();
}
function zoneClick(e){
  if(S.step!==2||S11.phase!=='q1'||S11.sel==null)return;
  if(e.target.closest('.m3-card11'))return;
  const z=e.target.closest('[data-zone]');if(!z)return;
  placeCard(S11.sel,z.dataset.zone);
}
function dndDown(e){
  if(S.step!==2||S11.phase!=='q1')return;
  const c=e.target.closest('.m3-card11');if(!c||dnd)return;
  dnd={c,id:+c.dataset.id,sx:e.clientX,sy:e.clientY,moved:false,ghost:null,w:c.offsetWidth,hl:null};
  window.addEventListener('pointermove',dndMove);window.addEventListener('pointerup',dndUp);window.addEventListener('pointercancel',dndCancel);
}
function dndStop(){
  window.removeEventListener('pointermove',dndMove);window.removeEventListener('pointerup',dndUp);window.removeEventListener('pointercancel',dndCancel);
  if(dnd&&dnd.ghost)dnd.ghost.remove();
  if(dnd&&dnd.hl)dnd.hl.classList.remove('hl');
  dnd=null;
}
function dndCancel(){dndStop()}
function dndMove(e){
  if(!dnd)return;
  const dx=e.clientX-dnd.sx,dy=e.clientY-dnd.sy;
  if(!dnd.moved&&Math.hypot(dx,dy)>6){
    dnd.moved=true;
    const g=dnd.c.cloneNode(true);g.classList.add('ghostc');g.style.width=dnd.w+'px';
    document.body.appendChild(g);dnd.ghost=g;dnd.c.style.opacity='.35';
  }
  if(dnd.moved){
    dnd.ghost.style.left=(e.clientX-dnd.w/2)+'px';dnd.ghost.style.top=(e.clientY-40)+'px';
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const z=el&&el.closest('[data-zone]');
    if(dnd.hl&&dnd.hl!==z)dnd.hl.classList.remove('hl');
    if(z&&z.classList.contains('m3-zone')){z.classList.add('hl');dnd.hl=z}else dnd.hl=null;
  }
}
function dndUp(e){
  if(!dnd)return;
  const d=dnd;
  if(d.moved){
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const z=el&&el.closest('[data-zone]');
    dndStop();
    if(z)placeCard(d.id,z.dataset.zone);else renderPractice();
  }else{
    dndStop();
    S11.sel=S11.sel===d.id?null:d.id;
    renderPractice();
  }
}


/* =====================================================================
   VÒNG LẶP, API MODULE, KHỞI ĐỘNG
   ===================================================================== */
function tickView(dt){
  const c=S.cam,three=is3D();
  if(S.auto){S.autoT+=dt;if(three)c.tyaw+=dt*.2;else{S.tpx=Math.sin(S.autoT*.45)*.9;S.tpy=Math.sin(S.autoT*.3)*.35}}
  const k=Math.min(1,dt*5);
  S.px=lerp(S.px,S.tpx,k);S.py=lerp(S.py,S.tpy,k);
  c.yaw=lerp(c.yaw,c.tyaw,k);c.pitch=lerp(c.pitch,c.tpitch,k);c.dist=lerp(c.dist,c.tdist,k);
  if(three){(S.step===0?scene9:field10).setView(c.yaw,c.pitch,c.dist)}
  else{const el=activeSceneEl();if(el){el.style.setProperty('--px',S.px.toFixed(3));el.style.setProperty('--py',S.py.toFixed(3))}}
}
function loop(ts){
  S.raf=requestAnimationFrame(loop);
  const dt=Math.min(.05,Math.max(0,(ts-S.last)/1000));S.last=ts;
  if(S.introOn)return;                /* intro: ảnh tĩnh */
  if(!S.active)return;
  tickView(dt);
  const d=S.paused?0:dt;
  if(S.step===0)tick9(d);else if(S.step===1)tick10(d);
}
function startLoop(){if(!S.raf){S.last=performance.now();S.raf=requestAnimationFrame(loop)}}
function stopLoop(){if(S.raf){cancelAnimationFrame(S.raf);S.raf=0}}

function introStart(){
  R('intro').classList.remove('on');S.introOn=false;
  mod.activate(0);
}

const mod={
  key:'canBangChuoiThucAn',
  stepLabels:STEP_LABELS.slice(),
  init(){build();return Promise.resolve()},
  showIntro(){
    build();S.root.hidden=false;S.active=false;S.introOn=true;
    R('intro').classList.add('on');startLoop();
  },
  activate(localIndex){
    build();
    S.root.hidden=false;R('intro').classList.remove('on');S.introOn=false;
    S.active=true;startLoop();
    gotoStep(typeof localIndex==='number'?localIndex:0,{force:true});
    return Promise.resolve();
  },
  gotoLocalStep(localIndex){gotoStep(localIndex);return Promise.resolve()},
  /* trợ giúp kiểm thử: chạy nhanh đồng hồ mô phỏng (không dùng trong bài giảng) */
  _advance(sec){const n=Math.ceil(sec/.05);for(let i=0;i<n&&S.active;i++){tickView(.05);const d=S.paused?0:.05;if(S.step===0)tick9(d);else if(S.step===1)tick10(d)}},
  deactivate(){
    if(!S.built)return;
    S.active=false;S.introOn=false;stopLoop();
    Aud.stop();T.clearAll();dndStop();
    closeKn(true);closeCmp();
    if(S9.running)abortRun9();
    S.paused=false;refreshPause();
    S.root.classList.remove('m3-playing');GLS.hide();
    S.root.hidden=true;
  }
};
window.LessonModules=window.LessonModules||{};
window.LessonModules.canBangChuoiThucAn=mod;

if(!window.KH4B30_M03_MANUAL){
  const boot=()=>mod.showIntro();
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
}
})();

</script>
